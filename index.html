        function compressImage(file, maxDim = 1600, quality = 0.82) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        let { width, height } = img;
                        if (width > maxDim || height > maxDim) {
                            if (width > height) {
                                height = Math.round(height * (maxDim / width));
                                width = maxDim;
                            } else {
                                width = Math.round(width * (maxDim / height));
                                height = maxDim;
                            }
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        canvas.toBlob((blob) => {
                            if (blob) resolve({ blob, dataUrl: canvas.toDataURL('image/jpeg', quality) });
                            else reject(new Error('compress failed'));
                        }, 'image/jpeg', quality);
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // Helper สำหรับอัปโหลดไฟล์ไปที่ Supabase Storage (Bucket: portfolio_bucket)
        async function uploadToSupabaseStorage(blob, path) {
            const client = window.supabaseClient;
            if (!client) throw new Error("Supabase client not initialized");

            const { data, error } = await client.storage
                .from('portfolio_bucket')
                .upload(path, blob, {
                    contentType: 'image/jpeg',
                    upsert: true
                });

            if (error) throw error;

            const { data: publicData } = client.storage
                .from('portfolio_bucket')
                .getPublicUrl(path);

            return publicData.publicUrl;
        }

                    } catch (err) {
                        showToast('ไม่สามารถลบกิจกรรมได้', 'error');
                    }
                }
            };

            const handleAddAnnouncement = async (e) => {
                e.preventDefault();
                if (!newAnnounceTitle) return;
                try {
                    const client = window.supabaseClient;
                    const newAnn = {
                        id: 'ann-' + Date.now(),
                        title: newAnnounceTitle,
                        tag: newAnnounceTag,
                        content: newAnnounceContent,
                        date: new Date().toISOString().split('T')[0],
                        createdAt: Date.now()
                    };
                    const { error } = await client.from('portfolio_announcements').insert([newAnn]);
                    if (error) throw error;

                    setNewAnnounceTitle('');
                    setNewAnnounceContent('');
                    showToast('เพิ่มประกาศเรียบร้อย');
                } catch (err) {
                    console.error("Error adding announcement:", err);
                    showToast('ไม่สามารถเพิ่มประกาศได้', 'error');
                }
            };

            const handleDeleteAnnouncement = async (id) => {
                try {
                    const client = window.supabaseClient;
                    const { error } = await client.from('portfolio_announcements').delete().eq('id', id);
                    if (error) throw error;

                    showToast('ลบประกาศเรียบร้อย');
                } catch (err) {
                    console.error("Error deleting announcement:", err);
                    showToast('ไม่สามารถลบประกาศได้', 'error');
                }
            };

            const handleAddVideo = async (e) => {
                e.preventDefault();
                if (!newVideoTitle || !newVideoUrl) return;
                let embed = newVideoUrl;
                if (newVideoUrl.includes('watch?v=')) {
                    embed = newVideoUrl.replace('watch?v=', 'embed/');
                } else if (newVideoUrl.includes('youtu.be/')) {
                    embed = newVideoUrl.replace('youtu.be/', 'www.youtube.com/embed/');
                }
                try {
                    const client = window.supabaseClient;
                    const newVid = {
                        id: 'vid-' + Date.now(),
                        title: newVideoTitle,
                        embedUrl: embed,
                        category: 'คลิปกิจกรรม',
                        createdAt: Date.now()
                    };
                    const { error } = await client.from('portfolio_videos').insert([newVid]);
                    if (error) throw error;

                    setNewVideoTitle('');
                    setNewVideoUrl('');
                    showToast('เพิ่มวิดีโอเรียบร้อย');
                } catch (err) {
                    console.error("Error adding video:", err);
                    showToast('ไม่สามารถเพิ่มวิดีโอได้', 'error');
                }
            };

            const handleDeleteVideo = async (id) => {
                try {
                    const client = window.supabaseClient;
                    const { error } = await client.from('portfolio_videos').delete().eq('id', id);
                    if (error) throw error;

                    showToast('ลบวิดีโอเรียบร้อย');
                } catch (err) {
                    console.error("Error deleting video:", err);
                    showToast('ไม่สามารถลบวิดีโอได้', 'error');
                }
            };

            // Derived / computed
            const totalCerts = useMemo(() => certFolders.reduce((sum, f) => sum + ((f.certificates || []).length), 0), [certFolders]);
            const homeFolders = useMemo(() => certFolders.filter(f => f.showOnHome), [certFolders]);
            const filteredFolders = useMemo(() => {
                const q = folderSearch.trim().toLowerCase();
                if (!q) return certFolders;
                return certFolders.filter(f => (f.title || '').toLowerCase().includes(q) || (f.description || '').toLowerCase().includes(q));
            }, [certFolders, folderSearch]);
            const filteredCerts = useMemo(() => {
                if (!selectedCertFolder) return [];
                const q = certSearch.trim().toLowerCase();
                const list = selectedCertFolder.certificates || [];
                if (!q) return list;
                return list.filter(c => (c.title || '').toLowerCase().includes(q));
            }, [selectedCertFolder, certSearch]);
            const sortedAnnouncements = useMemo(() => [...announcements].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)), [announcements]);
            const sortedVideos = useMemo(() => [...videos].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)), [videos]);
            const sortedActivities = useMemo(() => [...activities].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)), [activities]);

            const openLightbox = (certs, index) => setLightbox({ certs, index });
            const closeLightbox = () => setLightbox(null);
            const lightboxNext = () => setLightbox(l => l ? { ...l, index: (l.index + 1) % l.certs.length } : l);
            const lightboxPrev = () => setLightbox(l => l ? { ...l, index: (l.index - 1 + l.certs.length) % l.certs.length } : l);

            useEffect(() => {
                if (!lightbox) return;
                const onKey = (e) => {
                    if (e.key === 'Escape') closeLightbox();
                    if (e.key === 'ArrowRight') lightboxNext();
                    if (e.key === 'ArrowLeft') lightboxPrev();
                };
                window.addEventListener('keydown', onKey);
                return () => window.removeEventListener('keydown', onKey);
            }, [lightbox]);

            // Shared style tokens
            const card = "bg-white dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700/60 rounded-2xl shadow-sm";
            const inputCls = "w-full px-3 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-sm focus:border-gold-400 outline-none transition";
            const btnPrimary = "px-4 py-2.5 rounded-xl bg-gradient-to-r from-indigo-500 to-violet-600 text-white text-sm font-medium shadow hover:opacity-90 active:scale-95 transition disabled:opacity-50";
            const btnGhost = "px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 text-sm font-medium hover:bg-slate-100 dark:hover:bg-slate-800 active:scale-95 transition";
            const btnDanger = "text-red-500 hover:text-red-600 transition";

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Header */}
                    <header className="sticky top-0 z-40 backdrop-blur-md bg-slate-50/85 dark:bg-[#0f172a]/85 border-b border-slate-200 dark:border-slate-800">
                        <div className="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between gap-3">
                            <button onClick={() => setActiveTab('home')} className="flex items-center gap-2 min-w-0">
                                <img src={profile.avatarUrl} alt="" className="w-9 h-9 rounded-full object-cover ring-2 ring-gold-400/70 flex-shrink-0" />
                                <span className="font-semibold text-sm sm:text-base truncate max-w-[140px] sm:max-w-xs">{profile.name}</span>
                            </button>

                            <nav className="hidden sm:flex items-center gap-1 overflow-x-auto custom-scrollbar pb-1">
                                {TABS.map(t => (
                                    <button key={t.id} onClick={() => setActiveTab(t.id)}
                                        className={`px-3 py-2 rounded-lg text-sm font-medium transition flex items-center gap-1.5 whitespace-nowrap ${activeTab === t.id ? 'bg-indigo-500/10 text-indigo-500 dark:text-indigo-300' : 'text-slate-500 dark:text-slate-400 hover:bg-slate-200/60 dark:hover:bg-slate-800'}`}>
                                        <i className={`fa-solid ${t.icon} text-xs`}></i>{t.label}
                                    </button>
                                ))}
                            </nav>

                            <div className="flex items-center gap-2 flex-shrink-0">
                                <button aria-label="สลับโหมดสี" onClick={() => setIsDarkMode(!isDarkMode)} className="w-9 h-9 rounded-full flex items-center justify-center border border-slate-300 dark:border-slate-700 hover:bg-slate-200 dark:hover:bg-slate-800 transition">
                                    <i className={`fa-solid ${isDarkMode ? 'fa-sun' : 'fa-moon'} text-sm`}></i>
                                </button>
                                {isAdminLoggedIn ? (
                                    <button onClick={handleLogout} className="hidden sm:inline-flex px-3 py-2 rounded-lg text-sm font-medium border border-red-300 text-red-500 hover:bg-red-50 dark:hover:bg-red-500/10 transition">
                                        <i className="fa-solid fa-arrow-right-from-bracket mr-1.5"></i>ออก
                                    </button>
                                ) : (
                                    <button onClick={() => setShowLoginModal(true)} className="hidden sm:inline-flex w-9 h-9 rounded-full items-center justify-center border border-slate-300 dark:border-slate-700 hover:bg-slate-200 dark:hover:bg-slate-800 transition">
                                        <i className="fa-solid fa-lock text-sm"></i>
                                    </button>
                                )}
                                <button aria-label="เมนู" onClick={() => setMobileMenuOpen(!mobileMenuOpen)} className="sm:hidden w-9 h-9 rounded-full flex items-center justify-center border border-slate-300 dark:border-slate-700">
                                    <i className={`fa-solid ${mobileMenuOpen ? 'fa-xmark' : 'fa-bars'} text-sm`}></i>
                                </button>
                            </div>
                        </div>

                        {mobileMenuOpen && (
                            <div className="sm:hidden border-t border-slate-200 dark:border-slate-800 px-4 py-2 flex flex-col animate-fade-in">
                                {isAdminLoggedIn ? (
                                    <button onClick={handleLogout} className="text-left px-2 py-2.5 text-sm text-red-500 flex items-center gap-2">
                                        <i className="fa-solid fa-arrow-right-from-bracket w-4"></i>ออกจากระบบผู้ดูแล
                                    </button>
                                ) : (
                                    <button onClick={() => { setShowLoginModal(true); setMobileMenuOpen(false); }} className="text-left px-2 py-2.5 text-sm flex items-center gap-2">
                                        <i className="fa-solid fa-lock w-4"></i>เข้าสู่ระบบผู้ดูแล
                                    </button>
                                )}
                            </div>
                        )}
                    </header>

                    {/* Main content */}
                    <main className="flex-1 max-w-5xl w-full mx-auto px-4 py-6 pb-24 sm:pb-10">
                        {activeTab === 'home' && (
                            <HomeTab profile={profile} isAdminLoggedIn={isAdminLoggedIn} setIsEditProfileOpen={setIsEditProfileOpen}
                                totalCerts={totalCerts} certFolders={certFolders} announcements={sortedAnnouncements} videos={sortedVideos} activitiesCount={activities.length}
                                homeFolders={homeFolders} dataLoading={dataLoading}
                                openFolder={(f) => { setSelectedCertFolder(f); setActiveTab('certs'); }}
                                goTab={setActiveTab} card={card} btnGhost={btnGhost} />
                        )}

                        {activeTab === 'certs' && (
                            <CertsTab
                                selectedCertFolder={selectedCertFolder} setSelectedCertFolder={setSelectedCertFolder}
                                certFolders={filteredFolders} allFolders={certFolders} isAdminLoggedIn={isAdminLoggedIn}
                                folderSearch={folderSearch} setFolderSearch={setFolderSearch}
                                certSearch={certSearch} setCertSearch={setCertSearch} filteredCerts={filteredCerts}
                                setIsFolderModalOpen={setIsFolderModalOpen} setCurrentFolderForCert={setCurrentFolderForCert}
                                setIsCertUploadOpen={setIsCertUploadOpen} handleDeleteFolder={handleDeleteFolder}
                                toggleShowOnHome={toggleShowOnHome} handleDeleteCert={handleDeleteCert}
                                openLightbox={openLightbox} dataLoading={dataLoading}
                                card={card} btnPrimary={btnPrimary} btnGhost={btnGhost} inputCls={inputCls} btnDanger={btnDanger} />
                        )}

                        {activeTab === 'activities' && (
                            <ActivitiesTab activities={sortedActivities} isAdminLoggedIn={isAdminLoggedIn}
                                newActTitle={newActTitle} setNewActTitle={setNewActTitle}
                                newActDesc={newActDesc} setNewActDesc={setNewActDesc}
                                newActTag={newActTag} setNewActTag={setNewActTag}
                                actImagePreviews={actImagePreviews} handleActImageChange={handleActImageChange} removeActImage={removeActImage}
                                isCompressingAct={isCompressingAct} isUploadingAct={isUploadingAct} actUploadProgress={actUploadProgress}
                                handleAddActivity={handleAddActivity} handleDeleteActivity={handleDeleteActivity}
                                openLightbox={openLightbox}
                                card={card} btnPrimary={btnPrimary} inputCls={inputCls} btnDanger={btnDanger} />
                        )}

                        {activeTab === 'announcements' && (
                            <AnnouncementsTab announcements={sortedAnnouncements} isAdminLoggedIn={isAdminLoggedIn}
                                newAnnounceTitle={newAnnounceTitle} setNewAnnounceTitle={setNewAnnounceTitle}
                                newAnnounceTag={newAnnounceTag} setNewAnnounceTag={setNewAnnounceTag}
                                newAnnounceContent={newAnnounceContent} setNewAnnounceContent={setNewAnnounceContent}
                                handleAddAnnouncement={handleAddAnnouncement} handleDeleteAnnouncement={handleDeleteAnnouncement}
                                card={card} btnPrimary={btnPrimary} inputCls={inputCls} btnDanger={btnDanger} />
                        )}

                        {activeTab === 'videos' && (
                            <VideosTab videos={sortedVideos} isAdminLoggedIn={isAdminLoggedIn}
                                newVideoTitle={newVideoTitle} setNewVideoTitle={setNewVideoTitle}
                                newVideoUrl={newVideoUrl} setNewVideoUrl={setNewVideoUrl}
                                handleAddVideo={handleAddVideo} handleDeleteVideo={handleDeleteVideo}
                                card={card} btnPrimary={btnPrimary} inputCls={inputCls} btnDanger={btnDanger} />
                        )}
                    </main>

                    {/* Bottom nav (mobile) */}
                    <nav className="sm:hidden fixed bottom-0 left-0 right-0 z-40 bg-slate-50/95 dark:bg-[#0f172a]/95 backdrop-blur-md border-t border-slate-200 dark:border-slate-800 safe-bottom overflow-x-auto custom-scrollbar">
                        <div className="flex w-max min-w-full">
                            {TABS.map(t => (
                                <button key={t.id} onClick={() => setActiveTab(t.id)}
                                    className={`flex-1 flex flex-col items-center justify-center gap-0.5 py-2.5 px-3 text-[11px] font-medium transition ${activeTab === t.id ? 'text-indigo-500 dark:text-indigo-300' : 'text-slate-500 dark:text-slate-500'}`}>
                                    <i className={`fa-solid ${t.icon} text-base mb-0.5`}></i>
                                    {t.label}
                                </button>
                            ))}
                        </div>
                    </nav>

                    {/* Scroll to top */}
                    {showScrollTop && (
                        <button onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}
                            aria-label="กลับขึ้นบนสุด"
                            className="fixed right-4 bottom-24 sm:bottom-6 z-40 w-11 h-11 rounded-full bg-gradient-to-br from-indigo-500 to-violet-600 text-white shadow-lg flex items-center justify-center active:scale-90 transition">
                            <i className="fa-solid fa-arrow-up"></i>
                        </button>
                    )}

                    {/* Toast */}
                    {toast && (
                        <div className="fixed top-20 left-1/2 z-[60] animate-toast">
                            <div className={`px-4 py-2.5 rounded-xl shadow-lg text-sm font-medium flex items-center gap-2 text-white ${toast.type === 'error' ? 'bg-red-500' : 'bg-emerald-500'}`}>
                                <i className={`fa-solid ${toast.type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-check'}`}></i>
                                {toast.message}
                            </div>
                        </div>
                    )}

                    {/* Login modal */}
                    {showLoginModal && (
                        <Modal onClose={() => { setShowLoginModal(false); setLoginError(''); }} title="เข้าสู่ระบบผู้ดูแล">
                            <form onSubmit={handleLogin} className="space-y-3">
                                <input type="password" autoFocus value={adminPassword} onChange={e => setAdminPassword(e.target.value)}
                                    placeholder="รหัสผ่านผู้ดูแล" className={inputCls} />
                                {loginError && <p className="text-red-500 text-sm">{loginError}</p>}
                                <button type="submit" className={btnPrimary + " w-full"}>เข้าสู่ระบบ</button>
                            </form>
                        </Modal>
                    )}

                    {/* Edit profile modal */}
                    {isEditProfileOpen && (
                        <Modal onClose={() => { setIsEditProfileOpen(false); setProfileAvatarPreview(null); setProfileAvatarFile(null); }} title="แก้ไขโปรไฟล์">
                            <form onSubmit={handleSaveProfile} className="space-y-3">
                                <div className="flex flex-col items-center gap-1.5">
                                    <label htmlFor="profileAvatarInput" className="relative cursor-pointer group">
                                        <img src={profileAvatarPreview || editProfileData.avatarUrl} alt="" className="w-20 h-20 rounded-full object-cover ring-2 ring-gold-400" />
                                        <div className="absolute inset-0 rounded-full bg-black/40 opacity-0 group-hover:opacity-100 flex items-center justify-center transition">
                                            {isCompressingProfile ? <i className="fa-solid fa-spinner fa-spin text-white text-sm"></i> : <i className="fa-solid fa-camera text-white text-sm"></i>}
                                        </div>
                                    </label>
                                    <input id="profileAvatarInput" type="file" accept="image/*" className="hidden" onChange={handleProfileAvatarChange} />
                                    {isCompressingProfile && <span className="text-xs text-slate-400">กำลังเตรียมรูปภาพ...</span>}
                                </div>
                                <input value={editProfileData.name || ''} onChange={e => setEditProfileData({ ...editProfileData, name: e.target.value })} placeholder="ชื่อ" className={inputCls} />
                                <input value={editProfileData.subtitle || ''} onChange={e => setEditProfileData({ ...editProfileData, subtitle: e.target.value })} placeholder="คำโปรย" className={inputCls} />
                                <input value={editProfileData.tag || ''} onChange={e => setEditProfileData({ ...editProfileData, tag: e.target.value })} placeholder="แท็ก" className={inputCls} />
                                <textarea value={editProfileData.description || ''} onChange={e => setEditProfileData({ ...editProfileData, description: e.target.value })} placeholder="คำอธิบาย" rows="3" className={inputCls}></textarea>
                                {isUploadingProfile && profileAvatarFile && (
                                    <div className="w-full h-1.5 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden">
                                        <div className="h-full bg-gradient-to-r from-indigo-500 to-violet-600 transition-all" style={{ width: `${profileUploadProgress}%` }}></div>
                                    </div>
                                )}
                                <button type="submit" disabled={isUploadingProfile || isCompressingProfile} className={btnPrimary + " w-full"}>
                                    {isUploadingProfile ? <><i className="fa-solid fa-spinner fa-spin mr-2"></i>กำลังบันทึก...</> : 'บันทึก'}
                                </button>
                            </form>
                        </Modal>
                    )}

                    {/* Create folder modal */}
                    {isFolderModalOpen && (
                        <Modal onClose={() => setIsFolderModalOpen(false)} title="สร้างโฟลเดอร์ใหม่">
                            <form onSubmit={handleCreateFolder} className="space-y-3">
                                <input autoFocus value={newFolderTitle} onChange={e => setNewFolderTitle(e.target.value)} placeholder="ชื่อโฟลเดอร์" className={inputCls} />
                                <textarea value={newFolderDesc} onChange={e => setNewFolderDesc(e.target.value)} placeholder="คำอธิบาย" rows="2" className={inputCls}></textarea>
                                <label className="flex items-center gap-2 text-sm cursor-pointer">
                                    <input type="checkbox" checked={newFolderShowHome} onChange={e => setNewFolderShowHome(e.target.checked)} className="w-4 h-4 accent-indigo-500" />
                                    แสดงในหน้าแรก
                                </label>
                                <button type="submit" className={btnPrimary + " w-full"}>สร้างโฟลเดอร์</button>
                            </form>
                        </Modal>
                    )}

                    {/* Add certificate modal (Multiple upload) */}
                    {isCertUploadOpen && currentFolderForCert && (
                        <Modal onClose={() => { setIsCertUploadOpen(false); setCertImagePreviews([]); setCertImageFiles([]); setNewCertTitle(''); }} title={`เพิ่มเกียรติบัตร · ${currentFolderForCert.title}`}>
                            <form onSubmit={handleAddCertificate} className="space-y-3">
                                <input autoFocus value={newCertTitle} onChange={e => setNewCertTitle(e.target.value)} placeholder="ชื่อเกียรติบัตร" className={inputCls} />
                                
                                <div>
                                    <div className="flex flex-wrap gap-2 mb-2">
                                        {certImagePreviews.map((preview, i) => (
                                            <div key={i} className="relative w-16 h-16 rounded-lg border border-slate-200 dark:border-slate-700 overflow-hidden group">
                                                <img src={preview} className="w-full h-full object-cover" />
                                                <button type="button" onClick={() => removeCertImage(i)} className="absolute top-1 right-1 bg-black/60 hover:bg-red-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-[10px] opacity-0 group-hover:opacity-100 transition">
                                                    <i className="fa-solid fa-xmark"></i>
                                                </button>
                                            </div>
                                        ))}
                                        {certImagePreviews.length < 5 && ((currentFolderForCert.certificates || []).length + certImagePreviews.length) < 5 && (
                                            <label htmlFor="certImageInput" className={`w-16 h-16 rounded-lg border-2 border-dashed border-slate-300 dark:border-slate-600 flex flex-col items-center justify-center cursor-pointer hover:border-gold-400 transition ${isCompressingCert ? 'opacity-50' : ''}`}>
                                                 {isCompressingCert ? <i className="fa-solid fa-spinner fa-spin text-slate-400"></i> : <i className="fa-solid fa-plus text-slate-400"></i>}
                                            </label>
                                        )}
                                    </div>
                                    <input id="certImageInput" type="file" accept="image/*" multiple className="hidden" onChange={handleCertImageChange} disabled={isCompressingCert} />
                                    <p className="text-xs text-slate-400">
                                        {(currentFolderForCert.certificates || []).length + certImagePreviews.length}/5 ใบในโฟลเดอร์นี้
                                    </p>
                                </div>

                                {isUploadingCert && certImageFiles.length > 0 && (
                                    <div className="w-full h-1.5 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden">
                                        <div className="h-full bg-gradient-to-r from-indigo-500 to-violet-600 transition-all" style={{ width: `${certUploadProgress}%` }}></div>
                                    </div>
                                )}
                                <button type="submit" disabled={isUploadingCert || isCompressingCert || certImageFiles.length === 0} className={btnPrimary + " w-full"}>
                                    {isUploadingCert ? <><i className="fa-solid fa-spinner fa-spin mr-2"></i>กำลังอัปโหลด{certImageFiles.length ? ` ${certUploadProgress}%` : '...'}</> : 'เพิ่มเกียรติบัตร'}
                                </button>
                            </form>
                        </Modal>
                    )}

                    {/* Lightbox */}
                    {lightbox && (
                        <div className="fixed inset-0 z-[70] bg-black/90 flex items-center justify-center animate-fade-in" onClick={closeLightbox}>
                            <button aria-label="ปิด" onClick={closeLightbox} className="absolute top-4 right-4 w-10 h-10 rounded-full bg-white/10 text-white flex items-center justify-center hover:bg-white/20 transition">
                                <i className="fa-solid fa-xmark"></i>
                            </button>
                            {lightbox.certs.length > 1 && (
                                <button aria-label="ก่อนหน้า" onClick={(e) => { e.stopPropagation(); lightboxPrev(); }} className="absolute left-2 sm:left-6 w-11 h-11 rounded-full bg-white/10 text-white flex items-center justify-center hover:bg-white/20 transition">
                                    <i className="fa-solid fa-chevron-left"></i>
                                </button>
                            )}
                            <div className="max-w-4xl w-full px-4 flex flex-col items-center" onClick={e => e.stopPropagation()}>
                                <img src={lightbox.certs[lightbox.index].url} alt={lightbox.certs[lightbox.index].title} className="max-h-[75vh] w-auto mx-auto rounded-xl shadow-2xl object-contain" />
                                <div className="mt-4 flex flex-col items-center text-center text-white gap-2">
                                    <div className="flex items-center justify-center gap-3">
                                        <p className="font-medium text-sm sm:text-base">{lightbox.certs[lightbox.index].title}</p>
                                        <a href={lightbox.certs[lightbox.index].url} download target="_blank" rel="noopener noreferrer"
                                            className="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center hover:bg-white/20 transition flex-shrink-0" aria-label="ดาวน์โหลด">
                                            <i className="fa-solid fa-download text-xs"></i>
                                        </a>
                                    </div>
                                    {lightbox.certs[lightbox.index].desc && (
                                        <p className="text-sm text-white/70 max-w-lg mx-auto">{lightbox.certs[lightbox.index].desc}</p>
                                    )}
                                </div>
                                {lightbox.certs.length > 1 && <p className="text-white/50 text-xs mt-2">{lightbox.index + 1} / {lightbox.certs.length}</p>}
                            </div>
                            {lightbox.certs.length > 1 && (

        function CertCard({ cert: c, idx, certs, folderId, isAdminLoggedIn, openLightbox, handleDeleteCert }) {
            const [menuOpen, setMenuOpen] = React.useState(false);
            const menuRef = React.useRef(null);

            React.useEffect(() => {
                if (!menuOpen) return;
                const handler = (e) => {
                    if (menuRef.current && !menuRef.current.contains(e.target)) setMenuOpen(false);
                };
                document.addEventListener('mousedown', handler);
                document.addEventListener('touchstart', handler);
                return () => { document.removeEventListener('mousedown', handler); document.removeEventListener('touchstart', handler); };
            }, [menuOpen]);

            const handleShare = async () => {
                setMenuOpen(false);
                if (navigator.share) {
                    try { await navigator.share({ title: c.title, url: c.url }); } catch (_) {}
                } else {
                    try { await navigator.clipboard.writeText(c.url); alert('คัดลอกลิงก์แล้ว!'); } catch (_) {}
                }
            };

            const handleDownload = () => {
                setMenuOpen(false);
                const a = document.createElement('a');
                a.href = c.url;
                a.download = c.title || 'certificate';
                a.target = '_blank';
                a.rel = 'noopener noreferrer';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            };

            return (
                <div className="group relative bg-white dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700/60 rounded-2xl overflow-hidden">
                    <button onClick={() => openLightbox(certs, idx)} className="block w-full aspect-[3/4]">
                        <img src={c.url} alt={c.title} className="w-full h-full object-cover group-hover:scale-105 transition" />
                    </button>
                    <div className="p-2.5 flex items-start justify-between gap-1">
                        <p className="text-xs font-medium line-clamp-2 flex-1">{c.title}</p>
                        <div className="relative flex-shrink-0" ref={menuRef}>
                            <button
                                onClick={(e) => { e.stopPropagation(); setMenuOpen(v => !v); }}
                                aria-label="เพิ่มเติม"
                                className="w-6 h-6 rounded-full flex items-center justify-center text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 transition">
                                <i className="fa-solid fa-ellipsis-vertical text-xs"></i>
                            </button>
                            {menuOpen && (
                                <div className="absolute right-0 bottom-7 z-30 w-40 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-xl overflow-hidden animate-fade-in">
                                    <button onClick={() => { setMenuOpen(false); openLightbox(certs, idx); }}

                                        <i className="fa-solid fa-expand text-indigo-400 w-4 text-center"></i>ดูแบบเต็ม
                                    </button>
                                    <button onClick={handleDownload}
                                        className="w-full text-left px-3.5 py-2.5 text-sm flex items-center gap-2.5 hover:bg-slate-50 dark:hover:bg-slate-700/60 transition">
                                        <i className="fa-solid fa-download text-emerald-400 w-4 text-center"></i>ดาวน์โหลด
                                    </button>
                                    <button onClick={handleShare}
                                        className="w-full text-left px-3.5 py-2.5 text-sm flex items-center gap-2.5 hover:bg-slate-50 dark:hover:bg-slate-700/60 transition">
                                        <i className="fa-solid fa-share-nodes text-sky-400 w-4 text-center"></i>แชร์
                                    </button>
                                    {isAdminLoggedIn && (
                                        <>
                                            <div className="border-t border-slate-200 dark:border-slate-700 my-0.5"></div>
                                            <button onClick={() => { setMenuOpen(false); handleDeleteCert(folderId, c.id); }}
                                                className="w-full text-left px-3.5 py-2.5 text-sm flex items-center gap-2.5 hover:bg-red-50 dark:hover:bg-red-500/10 text-red-500 transition">

                                            </button>
                                        </>
                                    )}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );

                urlRegex.test(part)

                        className="text-indigo-500 dark:text-indigo-300 underline underline-offset-2 break-all hover:opacity-80 transition"

                    <button className="w-full text-left" onClick={() => hasLongContent && setExpanded(v => !v)}>
                        <div className="flex items-center gap-2 mb-1.5 pr-8">
                            <span className="text-[11px] px-2 py-0.5 rounded-full bg-indigo-500/10 text-indigo-500 dark:text-indigo-300">{a.tag}</span>
                            <span className="text-xs text-slate-400">{a.date}</span>
                        </div>
                        <p className="font-medium pr-8">{a.title}</p>
                        {a.content && (
                            <p className={`text-sm text-slate-500 dark:text-slate-400 mt-1.5 leading-relaxed whitespace-pre-wrap ${!expanded && hasLongContent ? 'line-clamp-3' : ''}`}>
                                {renderTextWithLinks(a.content)}
                            </p>
                        )}
                        {hasLongContent && (
                            <span className="text-xs text-indigo-500 dark:text-indigo-300 font-medium mt-1.5 inline-flex items-center gap-1">
                                {expanded ? <><i className="fa-solid fa-chevron-up text-[10px]"></i>ย่อ</> : <><i className="fa-solid fa-chevron-down text-[10px]"></i>อ่านเพิ่มเติม</>}
                            </span>
                        )}
                    </button>
                    {isAdminLoggedIn && (
                        <button onClick={() => handleDeleteAnnouncement(a.id)} className={btnDanger + " absolute top-4 right-4"} aria-label="ลบประกาศ">
                            <i className="fa-solid fa-trash text-sm"></i>
                        </button>
                    )}
                </div>
            );
        }

        function AnnouncementsTab({ announcements, isAdminLoggedIn, newAnnounceTitle, setNewAnnounceTitle, newAnnounceTag, setNewAnnounceTag, newAnnounceContent, setNewAnnounceContent, handleAddAnnouncement, handleDeleteAnnouncement, card, btnPrimary, inputCls, btnDanger }) {
            const tags = ['ทั่วไป', 'กิจกรรม', 'ผลงาน', 'สำคัญ'];
            return (
                <div className="animate-fade-in space-y-5">
                    <h1 className="text-xl sm:text-2xl font-bold">ประกาศ &amp; ข่าวสาร</h1>

                    {isAdminLoggedIn && (
                        <form onSubmit={handleAddAnnouncement} className={card + " p-4 space-y-3"}>
                            <input value={newAnnounceTitle} onChange={e => setNewAnnounceTitle(e.target.value)} placeholder="หัวข้อประกาศ" className={inputCls} />
                            <select value={newAnnounceTag} onChange={e => setNewAnnounceTag(e.target.value)} className={inputCls}>
                                {tags.map(t => <option key={t} value={t}>{t}</option>)}
                            </select>
                            <textarea value={newAnnounceContent} onChange={e => setNewAnnounceContent(e.target.value)} placeholder="รายละเอียด (ใส่ลิงก์ URL ได้เลย)" rows="2" className={inputCls}></textarea>
                            <button type="submit" className={btnPrimary}><i className="fa-solid fa-plus mr-1.5"></i>เพิ่มประกาศ</button>
                        </form>
                    )}

                    {announcements.length === 0 ? (
                        <EmptyState icon="fa-bullhorn" text="ยังไม่มีประกาศ" />
                    ) : (
                        <div className="space-y-3">
                            {announcements.map(a => (
                                <AnnouncementCard key={a.id} a={a} isAdminLoggedIn={isAdminLoggedIn}
                                    handleDeleteAnnouncement={handleDeleteAnnouncement} card={card} btnDanger={btnDanger} />
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        function VideosTab({ videos, isAdminLoggedIn, newVideoTitle, setNewVideoTitle, newVideoUrl, setNewVideoUrl, handleAddVideo, handleDeleteVideo, card, btnPrimary, inputCls, btnDanger }) {
            return (
                <div className="animate-fade-in space-y-5">
                    <h1 className="text-xl sm:text-2xl font-bold">คลิปวิดีโอกิจกรรม</h1>

                    {isAdminLoggedIn && (
                        <form onSubmit={handleAddVideo} className={card + " p-4 space-y-3"}>
                            <input value={newVideoTitle} onChange={e => setNewVideoTitle(e.target.value)} placeholder="ชื่อวิดีโอ" className={inputCls} />
                            <input value={newVideoUrl} onChange={e => setNewVideoUrl(e.target.value)} placeholder="ลิงก์ YouTube" className={inputCls} />
                            <button type="submit" className={btnPrimary}><i className="fa-solid fa-plus mr-1.5"></i>เพิ่มวิดีโอ</button>
                        </form>
                    )}

                    {videos.length === 0 ? (
                        <EmptyState icon="fa-video" text="ยังไม่มีวิดีโอ" />
                    ) : (
                        <div className="grid sm:grid-cols-2 gap-4">
                            {videos.map(v => (
                                <div key={v.id} className={card + " overflow-hidden"}>
                                    <div className="aspect-video bg-black">
                                        <iframe src={v.embedUrl} title={v.title} className="w-full h-full" allowFullScreen loading="lazy"></iframe>
                                    </div>
                                    <div className="p-3 flex items-center justify-between gap-2">
                                        <p className="font-medium text-sm line-clamp-2">{v.title}</p>
                                        {isAdminLoggedIn && (
                                            <button onClick={() => handleDeleteVideo(v.id)} className={btnDanger + " flex-shrink-0"} aria-label="ลบวิดีโอ">
                                                <i className="fa-solid fa-trash text-sm"></i>
                                            </button>
                                        )}
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
