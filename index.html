<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal School Portfolio & Portal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Kanit) -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glass-card {
            background: rgba(51, 65, 85, 0.5);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.5);
            border-radius: 4px;
        }
    </style>
</head>
<body class="min-h-screen custom-scrollbar">
    <div id="root"></div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDocs, addDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global Firebase Config fallback
        const firebaseConfig = typeof __firebase_config !== 'undefined' 
            ? JSON.parse(__firebase_config) 
            : {
            apiKey: "AIzaSyCk01n1Kwg_vss31jqM937DvH5rhONQ3sk",
            authDomain: "verify-bot-1fb01.firebaseapp.com",
            projectId: "verify-bot-1fb01",
            storageBucket: "verify-bot-1fb01.firebasestorage.app",
            messagingSenderId: "902200428070",
            appId: "1:902200428070:web:9214e5a6a3ba3b0f60c8e7",
           measurementId: "G-EP8S5H2HH2"
            };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'school-portfolio-app';

        window.firebaseApp = { app, auth, db, appId, signInWithCustomToken, signInAnonymously, onAuthStateChanged, signOut, collection, doc, setDoc, getDocs, addDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy };
    </script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Mock Initial Data for immediate preview if Firebase is in standalone mode
        const initialCertFolders = [
            {
                id: 'cert-1',
                title: 'รางวัลการแข่งขันคอมพิวเตอร์และเทคโนโลยี',
                description: 'การแข่งขันเขียนโปรแกรมและพัฒนาเว็บไซต์ระดับภาคตะวันออกเฉียงเหนือ ประจำปี 2568',
                showOnHome: true,
                certificates: [
                    { id: 'c1', title: 'เหรียญทอง การประกวด Web Application', url: 'https://images.unsplash.com/photo-1579546929518-9e396f3cc809?w=600&auto=format&fit=crop&q=60' },
                    { id: 'c2', title: 'รองชนะเลิศอันดับ 1 หุ่นยนต์กู้ภัย', url: 'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=600&auto=format&fit=crop&q=60' }
                ]
            },
            {
                id: 'cert-2',
                title: 'กิจกรรมคุณธรรมและจิตอาสาโรงเรียน',
                description: 'รวบรวมเกียรติบัตรการเข้าร่วมกิจกรรมบำเพ็ญประโยชน์ สภานักเรียน และจิตอาสา',
                showOnHome: true,
                certificates: [
                    { id: 'c3', title: 'ประธานสภานักเรียน ประจำปีการศึกษา 2568', url: 'https://images.unsplash.com/photo-1523240795612-9a054b0db644?w=600&auto=format&fit=crop&q=60' }
                ]
            }
        ];

        const initialAnnouncements = [
            { id: 'a1', title: 'เปิดรับการประเมินพอร์ตโฟลิโอวิชาการ 2569', date: '2026-08-01', content: 'ยินดีต้อนรับคณะกรรมการต้อนรับการประเมิน สามารถเรียกดูเกียรติบัตรและคลิปสาธิตผลงานผ่านแท็บต่างๆ ได้ครับ', tag: 'ประกาศสำคัญ' },
            { id: 'a2', title: 'สรุปการแข่งขันนวัตกรรมนักเรียน', date: '2026-07-25', content: 'ได้รับรางวัลระดับเหรียญทองยอดเยี่ยมในการนำเสนอโครงงานเทคโนโลยีสารสนเทศ', tag: 'ผลการแข่งขัน' }
        ];

        const initialVideos = [
            { id: 'v1', title: 'คลิปนำเสนอโครงงานระบบจัดการโรงเรียน', embedUrl: 'https://www.youtube.com/embed/dQw4w9WgXcQ', category: 'ผลงานเด่น' }
        ];

        function App() {
            const [user, setUser] = useState(null);
            const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);
            const [activeTab, setActiveTab] = useState('home'); // home, certs, announcements, videos, admin
            const [showLoginModal, setShowLoginModal] = useState(false);
            const [adminPassword, setAdminPassword] = useState('');
            const [loginError, setLoginError] = useState('');

            // Data States
            const [certFolders, setCertFolders] = useState(initialCertFolders);
            const [announcements, setAnnouncements] = useState(initialAnnouncements);
            const [videos, setVideos] = useState(initialVideos);

            // Modals
            const [selectedCertFolder, setSelectedCertFolder] = useState(null);
            const [isFolderModalOpen, setIsFolderModalOpen] = useState(false);
            const [isCertUploadOpen, setIsCertUploadOpen] = useState(false);
            const [currentFolderForCert, setCurrentFolderForCert] = useState(null);

            // Form inputs
            const [newFolderTitle, setNewFolderTitle] = useState('');
            const [newFolderDesc, setNewFolderDesc] = useState('');
            const [newFolderShowHome, setNewFolderShowHome] = useState(false);

            const [newCertTitle, setNewCertTitle] = useState('');
            const [newCertUrl, setNewCertUrl] = useState('');

            const [newAnnounceTitle, setNewAnnounceTitle] = useState('');
            const [newAnnounceTag, setNewAnnounceTag] = useState('ทั่วไป');
            const [newAnnounceContent, setNewAnnounceContent] = useState('');

            const [newVideoTitle, setNewVideoTitle] = useState('');
            const [newVideoUrl, setNewVideoUrl] = useState('');

            // Initialize Firebase Auth
            useEffect(() => {
                const checkFirebase = setInterval(() => {
                    if (window.firebaseApp) {
                        clearInterval(checkFirebase);
                        const { auth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } = window.firebaseApp;

                        const initAuth = async () => {
                            try {
                                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                                    await signInWithCustomToken(auth, __initial_auth_token);
                                } else {
                                    await signInAnonymously(auth);
                                }
                            } catch (e) {
                                console.warn("Auth initialization fallback:", e);
                            }
                        };
                        initAuth();

                        onAuthStateChanged(auth, (usr) => {
                            setUser(usr);
                        });
                    }
                }, 100);

                return () => clearInterval(checkFirebase);
            }, []);

            // Handle Admin Login (Personal Lock)
            const handleLogin = (e) => {
                e.preventDefault();
                // Simple master passcode for owner (Default: admin123)
                if (adminPassword === 'admin123' || adminPassword === 'school2026') {
                    setIsAdminLoggedIn(true);
                    setShowLoginModal(false);
                    setAdminPassword('');
                    setLoginError('');
                } else {
                    setLoginError('รหัสผ่านไม่ถูกต้อง! (รหัสผ่านทดสอบ: admin123)');
                }
            };

            const handleLogout = () => {
                setIsAdminLoggedIn(false);
            };

            // Certificate Folder Operations
            const handleCreateFolder = (e) => {
                e.preventDefault();
                if (!newFolderTitle) return;
                const newFolder = {
                    id: 'folder-' + Date.now(),
                    title: newFolderTitle,
                    description: newFolderDesc,
                    showOnHome: newFolderShowHome,
                    certificates: []
                };
                setCertFolders([newFolder, ...certFolders]);
                setNewFolderTitle('');
                setNewFolderDesc('');
                setNewFolderShowHome(false);
                setIsFolderModalOpen(false);
            };

            const handleDeleteFolder = (folderId) => {
                if (confirm('คุณแน่ใจหรือไม่ว่าต้องการลบโฟลเดอร์นี้และเกียรติบัตรข้างในทั้งหมด?')) {
                    setCertFolders(certFolders.filter(f => f.id !== folderId));
                }
            };

            const toggleShowOnHome = (folderId) => {
                setCertFolders(certFolders.map(f => {
                    if (f.id === folderId) {
                        return { ...f, showOnHome: !f.showOnHome };
                    }
                    return f;
                }));
            };

            // Certificate Upload within Folder (Max 5 Limit)
            const handleAddCertificate = (e) => {
                e.preventDefault();
                if (!newCertTitle || !newCertUrl || !currentFolderForCert) return;

                if (currentFolderForCert.certificates.length >= 5) {
                    alert('โฟลเดอร์นี้อัปโหลดเกียรติบัตรครบ 5 ใบแล้ว! (จำกัดสูงสุด 5 ใบต่อโฟลเดอร์)');
                    return;
                }

                const updatedFolders = certFolders.map(folder => {
                    if (folder.id === currentFolderForCert.id) {
                        const updatedCerts = [
                            ...folder.certificates,
                            {
                                id: 'cert-' + Date.now(),
                                title: newCertTitle,
                                url: newCertUrl
                            }
                        ];
                        const updatedFolder = { ...folder, certificates: updatedCerts };
                        // Update current modal state if open
                        if (selectedCertFolder && selectedCertFolder.id === folder.id) {
                            setSelectedCertFolder(updatedFolder);
                        }
                        return updatedFolder;
                    }
                    return folder;
                });

                setCertFolders(updatedFolders);
                setNewCertTitle('');
                setNewCertUrl('');
                setIsCertUploadOpen(false);
            };

            const handleDeleteCert = (folderId, certId) => {
                const updatedFolders = certFolders.map(folder => {
                    if (folder.id === folderId) {
                        const updatedCerts = folder.certificates.filter(c => c.id !== certId);
                        const updatedFolder = { ...folder, certificates: updatedCerts };
                        if (selectedCertFolder && selectedCertFolder.id === folderId) {
                            setSelectedCertFolder(updatedFolder);
                        }
                        return updatedFolder;
                    }
                    return folder;
                });
                setCertFolders(updatedFolders);
            };

            // Announcement Operations
            const handleAddAnnouncement = (e) => {
                e.preventDefault();
                if (!newAnnounceTitle) return;
                const item = {
                    id: 'ann-' + Date.now(),
                    title: newAnnounceTitle,
                    tag: newAnnounceTag,
                    content: newAnnounceContent,
                    date: new Date().toISOString().split('T')[0]
                };
                setAnnouncements([item, ...announcements]);
                setNewAnnounceTitle('');
                setNewAnnounceContent('');
            };

            const handleDeleteAnnouncement = (id) => {
                setAnnouncements(announcements.filter(a => a.id !== id));
            };

            // Video Operations
            const handleAddVideo = (e) => {
                e.preventDefault();
                if (!newVideoTitle || !newVideoUrl) return;
                
                // Format youtube URL to embed format if needed
                let embed = newVideoUrl;
                if (newVideoUrl.includes('watch?v=')) {
                    embed = newVideoUrl.replace('watch?v=', 'embed/');
                } else if (newVideoUrl.includes('youtu.be/')) {
                    embed = newVideoUrl.replace('youtu.be/', 'www.youtube.com/embed/');
                }

                const item = {
                    id: 'vid-' + Date.now(),
                    title: newVideoTitle,
                    embedUrl: embed,
                    category: 'คลิปกิจกรรม'
                };
                setVideos([item, ...videos]);
                setNewVideoTitle('');
                setNewVideoUrl('');
            };

            const handleDeleteVideo = (id) => {
                setVideos(videos.filter(v => v.id !== id));
            };

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Navigation Header */}
                    <nav className="glass-panel sticky top-0 z-40 border-b border-slate-700/50 px-4 lg:px-8 py-3">
                        <div className="max-w-7xl mx-auto flex justify-between items-center">
                            <div className="flex items-center gap-3 cursor-pointer" onClick={() => setActiveTab('home')}>
                                <div className="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center font-bold text-xl shadow-lg shadow-indigo-500/30 text-white">
                                    <i className="fa-solid fa-graduation-cap"></i>
                                </div>
                                <div>
                                    <h1 className="font-bold text-lg text-white leading-tight">My School Portfolio</h1>
                                    <p className="text-xs text-indigo-300">ระบบเกียรติบัตรและพอร์ตส่วนบุคคล</p>
                                </div>
                            </div>

                            {/* Menu Tabs */}
                            <div className="hidden md:flex items-center gap-1 bg-slate-800/80 p-1.5 rounded-xl border border-slate-700/50">
                                <button 
                                    onClick={() => setActiveTab('home')}
                                    className={`px-4 py-2 rounded-lg text-sm font-medium transition-all ${activeTab === 'home' ? 'bg-indigo-600 text-white shadow' : 'text-slate-300 hover:text-white hover:bg-slate-700/50'}`}>
                                    <i className="fa-solid fa-house mr-2"></i>หน้าหลัก
                                </button>
                                <button 
                                    onClick={() => setActiveTab('certs')}
                                    className={`px-4 py-2 rounded-lg text-sm font-medium transition-all ${activeTab === 'certs' ? 'bg-indigo-600 text-white shadow' : 'text-slate-300 hover:text-white hover:bg-slate-700/50'}`}>
                                    <i className="fa-solid fa-folder-open mr-2"></i>แฟ้มเกียรติบัตร
                                </button>
                                <button 
                                    onClick={() => setActiveTab('announcements')}
                                    className={`px-4 py-2 rounded-lg text-sm font-medium transition-all ${activeTab === 'announcements' ? 'bg-indigo-600 text-white shadow' : 'text-slate-300 hover:text-white hover:bg-slate-700/50'}`}>
                                    <i className="fa-solid fa-bullhorn mr-2"></i>ประกาศ
                                </button>
                                <button 
                                    onClick={() => setActiveTab('videos')}
                                    className={`px-4 py-2 rounded-lg text-sm font-medium transition-all ${activeTab === 'videos' ? 'bg-indigo-600 text-white shadow' : 'text-slate-300 hover:text-white hover:bg-slate-700/50'}`}>
                                    <i className="fa-solid fa-circle-play mr-2"></i>คลิปผลงาน
                                </button>
                            </div>

                            {/* Auth Controls */}
                            <div className="flex items-center gap-3">
                                {isAdminLoggedIn ? (
                                    <div className="flex items-center gap-2">
                                        <span className="bg-emerald-500/20 text-emerald-400 text-xs px-3 py-1.5 rounded-full border border-emerald-500/30 flex items-center gap-1.5 font-medium">
                                            <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                                            สถานะ: เจ้าของระบบ (Admin)
                                        </span>
                                        <button 
                                            onClick={handleLogout}
                                            className="px-3 py-1.5 bg-rose-600/20 hover:bg-rose-600 text-rose-300 hover:text-white rounded-lg text-xs font-medium border border-rose-500/30 transition">
                                            <i className="fa-solid fa-right-from-bracket mr-1"></i>ออก
                                        </button>
                                    </div>
                                ) : (
                                    <button 
                                        onClick={() => setShowLoginModal(true)}
                                        className="px-4 py-2 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white rounded-xl text-sm font-medium shadow-md shadow-indigo-500/20 transition flex items-center gap-2">
                                        <i className="fa-solid fa-[#lock] fa-key"></i> เข้าสู่ระบบเฉพาะฉัน
                                    </button>
                                )}
                            </div>
                        </div>
                    </nav>

                    {/* Mobile Navigation bar */}
                    <div className="md:hidden glass-panel border-b border-slate-700/50 px-2 py-2 flex justify-around">
                        <button onClick={() => setActiveTab('home')} className={`p-2 text-xs flex flex-col items-center ${activeTab === 'home' ? 'text-indigo-400 font-bold' : 'text-slate-400'}`}>
                            <i className="fa-solid fa-house text-lg mb-1"></i>หน้าหลัก
                        </button>
                        <button onClick={() => setActiveTab('certs')} className={`p-2 text-xs flex flex-col items-center ${activeTab === 'certs' ? 'text-indigo-400 font-bold' : 'text-slate-400'}`}>
                            <i className="fa-solid fa-folder-open text-lg mb-1"></i>เกียรติบัตร
                        </button>
                        <button onClick={() => setActiveTab('announcements')} className={`p-2 text-xs flex flex-col items-center ${activeTab === 'announcements' ? 'text-indigo-400 font-bold' : 'text-slate-400'}`}>
                            <i className="fa-solid fa-bullhorn text-lg mb-1"></i>ประกาศ
                        </button>
                        <button onClick={() => setActiveTab('videos')} className={`p-2 text-xs flex flex-col items-center ${activeTab === 'videos' ? 'text-indigo-400 font-bold' : 'text-slate-400'}`}>
                            <i className="fa-solid fa-circle-play text-lg mb-1"></i>คลิป
                        </button>
                    </div>

                    {/* HERO BOARD (TOP BOARD) */}
                    <div className="bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 py-10 px-4 border-b border-slate-800 relative overflow-hidden">
                        <div className="absolute -top-24 -right-24 w-96 h-96 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>
                        <div className="absolute -bottom-24 -left-24 w-96 h-96 bg-purple-500/10 rounded-full blur-3xl pointer-events-none"></div>

                        <div className="max-w-7xl mx-auto flex flex-col md:flex-row items-center gap-8 relative z-10">
                            {/* Profile / Avatar */}
                            <div className="relative group">
                                <div className="w-32 h-32 md:w-40 md:h-40 rounded-3xl overflow-hidden border-4 border-indigo-500/30 shadow-2xl bg-slate-800 flex items-center justify-center">
                                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500&auto=format&fit=crop&q=60" alt="นักเรียน/เจ้าของพอร์ต" className="w-full h-full object-cover" />
                                </div>
                                <span className="absolute bottom-2 right-2 w-5 h-5 bg-emerald-500 border-2 border-slate-900 rounded-full shadow-md" title="พร้อมสำหรับการประเมิน"></span>
                            </div>

                            {/* Info Detail */}
                            <div className="flex-1 text-center md:text-left">
                                <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-indigo-300 text-xs font-medium mb-3">
                                    <i className="fa-solid fa-school"></i> แฟ้มสะสมผลงานและเกียรติบัตรนักเรียน
                                </div>
                                <h1 className="text-3xl md:text-4xl font-extrabold text-white tracking-tight">
                                    นายณัฐภัทร วิทยาการ <span className="text-indigo-400 text-2xl font-normal">(พอร์ตโฟลิโอส่วนตัว)</span>
                                </h1>
                                <p className="text-slate-300 mt-2 text-sm md:text-base max-w-2xl leading-relaxed">
                                    ยินดีต้อนรับสู่บอร์ดผลงานส่วนบุคคล รวบรวมเกียรติบัตร กิจกรรม และโครงงานวิทยาศาสตร์-เทคโนโลยี โรงเรียนสาธิตประจำจังหวัด
                                </p>

                                <div className="flex flex-wrap items-center justify-center md:justify-start gap-4 mt-4 text-xs text-slate-400">
                                    <span className="flex items-center gap-1.5 bg-slate-800/80 px-3 py-1.5 rounded-lg border border-slate-700/50">
                                        <i className="fa-solid fa-award text-amber-400"></i> โฟลเดอร์เกียรติบัตร: {certFolders.length} หมวด
                                    </span>
                                    <span className="flex items-center gap-1.5 bg-slate-800/80 px-3 py-1.5 rounded-lg border border-slate-700/50">
                                        <i className="fa-solid fa-file-certificate text-indigo-400"></i> รวมรูปภาพเกียรติบัตร: {certFolders.reduce((acc, f) => acc + f.certificates.length, 0)} ใบ
                                    </span>
                                    <span className="flex items-center gap-1.5 bg-slate-800/80 px-3 py-1.5 rounded-lg border border-slate-700/50">
                                        <i className="fa-solid fa-video text-purple-400"></i> วิดีโอผลงาน: {videos.length} รายการ
                                    </span>
                                </div>
                            </div>

                            {/* Quick Admin Notice */}
                            {!isAdminLoggedIn && (
                                <div className="glass-card p-4 rounded-2xl max-w-xs text-center border border-indigo-500/20">
                                    <i className="fa-solid fa-eye text-indigo-400 text-2xl mb-2"></i>
                                    <p className="text-xs text-slate-300">คุณกำลังรับชมในโหมด <strong className="text-white">ผู้เยี่ยมชมทั่วไป (Read-Only)</strong> หากต้องการจัดการข้อมูล กรุณาเข้าสู่ระบบ</p>
                                </div>
                            )}
                        </div>

                                            value={newFolderDesc}
                                            onChange={e => setNewFolderDesc(e.target.value)}
                                            className="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-sm text-white focus:outline-none focus:border-indigo-500"></textarea>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <input 
                                            type="checkbox" 
                                            id="showHome" 
                                            checked={newFolderShowHome}
                                            onChange={e => setNewFolderShowHome(e.target.checked)}
                                            className="rounded bg-slate-900 border-slate-700 text-indigo-600 focus:ring-0" 
                                        />
                                        <label htmlFor="showHome" className="text-xs text-slate-300 cursor-pointer">ปักหมุดแสดงที่หน้าหลักทันที</label>
                                    </div>
                                    <div className="flex gap-3 pt-2">
                                        <button 
                                            type="button" 
                                            onClick={() => setIsFolderModalOpen(false)}
                                            className="flex-1 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-sm font-medium">
                                            ยกเลิก
                                        </button>
                                        <button 
                                            type="submit" 
                                            className="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-medium">
                                            สร้างโฟลเดอร์
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL: Upload Certificate to Folder */}
                    {isCertUploadOpen && (
                        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="glass-panel max-w-md w-full rounded-3xl p-6">
                                <h3 className="text-xl font-bold text-white mb-2">อัปโหลดเกียรติบัตร</h3>
                                <p className="text-xs text-indigo-300 mb-4">โฟลเดอร์: {currentFolderForCert?.title}</p>

                                <form onSubmit={handleAddCertificate} className="space-y-4">
                                    <div>
                                        <label className="block text-xs text-slate-300 mb-1">ชื่อเกียรติบัตร / รางวัลที่ได้รับ *</label>
                                        <input 
                                            type="text" 
                                            placeholder="เช่น รางวัลเหรียญทอง การแข่งขันคอมพิวเตอร์" 
                                            value={newCertTitle}
                                            onChange={e => setNewCertTitle(e.target.value)}
                                            required
                                            className="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-sm text-white focus:outline-none focus:border-indigo-500" 
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs text-slate-300 mb-1">URL รูปภาพเกียรติบัตร *</label>
                                        <input 
                                            type="url" 
                                            placeholder="https://... (วางลิงก์รูปภาพ)" 
                                            value={newCertUrl}
                                            onChange={e => setNewCertUrl(e.target.value)}
                                            required
                                            className="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-sm text-white focus:outline-none focus:border-indigo-500" 
                                        />
                                        <span className="text-[10px] text-slate-500 mt-1 block">* สามารถใช้องค์ประกอบลิงก์รูปภาพสาธารณะได้</span>
                                    </div>

                                    <div className="flex gap-3 pt-2">
                                        <button 
                                            type="button" 
                                            onClick={() => setIsCertUploadOpen(false)}
                                            className="flex-1 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-sm font-medium">
                                            ยกเลิก
                                        </button>
                                        <button 
                                            type="submit" 
                                            className="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-medium">
                                            บันทึกเกียรติบัตร
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL: Admin Login */}
                    {showLoginModal && (
                        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
                            <div className="glass-panel max-w-sm w-full rounded-3xl p-6 relative">
                                <button 
                                    onClick={() => setShowLoginModal(false)}
                                    className="absolute top-4 right-4 text-slate-400 hover:text-white">
                                    <i className="fa-solid fa-xmark"></i>
                                </button>
                                
                                <div className="text-center mb-6">
                                    <div className="w-12 h-12 rounded-2xl bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 flex items-center justify-center mx-auto mb-2 text-xl">
                                        <i className="fa-solid fa-lock"></i>
                                    </div>
                                    <h3 className="text-xl font-bold text-white">เข้าสู่ระบบเฉพาะเจ้าของ</h3>
                                    <p className="text-xs text-slate-400 mt-1">ป้อนรหัสผ่านเพื่อสลับเป็นโหมดจัดการข้อมูล (Admin)</p>
                                </div>

                                <form onSubmit={handleLogin} className="space-y-4">
                                    <div>
                                        <label className="block text-xs text-slate-300 mb-1">รหัสผ่านบัญชีส่วนตัว</label>
                                        <input 
                                            type="password" 
                                            placeholder="กรอกรหัสผ่านเจ้าของระบบ..." 
                                            value={adminPassword}
                                            onChange={e => setAdminPassword(e.target.value)}
                                            required
                                            className="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-sm text-white focus:outline-none focus:border-indigo-500" 
                                        />
                                    </div>

                                    {loginError && (
                                        <p className="text-xs text-rose-400 font-medium text-center">{loginError}</p>
                                    )}

                                    <button 
                                        type="submit" 
                                        className="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-medium shadow-lg shadow-indigo-600/30 transition">
                                        ยืนยันการเข้าสู่ระบบ
                                    </button>
                                </form>
                                <p className="text-[11px] text-slate-500 text-center mt-4">
                                    * รหัสผ่านเริ่มต้นคือ: <code className="text-indigo-300">admin123</code>
                                </p>
                            </div>
                        </div>
                    )}

                    {/* FOOTER */}
                    <footer className="border-t border-slate-800 py-6 px-4 text-center text-xs text-slate-500">
                        <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-2">
                            <p>© 2026 Personal School Portfolio & Portal System. All rights reserved.</p>
                            <p className="text-slate-400">ระบบเกียรติบัตรส่วนบุคคล พัฒนาสำหรับ Vercel & Firebase Deploy</p>
                        </div>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
