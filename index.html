<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Web</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {}
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body {
            font-family: 'Kanit', sans-serif;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.5);
            border-radius: 4px;
        }
    </style>
</head>
<body class="min-h-screen custom-scrollbar bg-slate-50 dark:bg-[#0f172a] text-slate-800 dark:text-[#f8fafc] transition-colors duration-300">
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDocs, addDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCk01n1Kwg_vss31jqM937DvH5rhONQ3sk",
            authDomain: "verify-bot-1fb01.firebaseapp.com",
            projectId: "verify-bot-1fb01",
            storageBucket: "verify-bot-1fb01.firebasestorage.app",
            messagingSenderId: "902200428070",
            appId: "1:902200428070:web:9214e5a6a3ba3b0f60c8e7",
            measurementId: "G-EP8S5H2HH2"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.firebaseApp = { app, auth, db, signInWithCustomToken, signInAnonymously, onAuthStateChanged, signOut, collection, doc, setDoc, getDocs, addDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy };
    </script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const MY_PROFILE = {
            name: "ด.ช. ธนัชชัย *******",
            subtitle: "พอร์ตโฟลิโอส่วนตัว",
            description: "ยินดีต้อนรับสู่บอร์ดผลงานส่วนบุคคล รวบรวมเกียรติบัตร กิจกรรม และโครงงานต่างๆ ของฉัน",
            tag: "แฟ้มสะสมผลงานและเกียรติบัตรนักเรียน",
            avatarUrl: "https://i.postimg.cc/YSkSswXK/763308317-1075293791678427-2332511763279306518-n.jpg"
        };

        function App() {
            const [user, setUser] = useState(null);
            const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);
            const [activeTab, setActiveTab] = useState('home');
            const [showLoginModal, setShowLoginModal] = useState(false);
            const [adminPassword, setAdminPassword] = useState('');
            const [loginError, setLoginError] = useState('');
            
            const [isDarkMode, setIsDarkMode] = useState(true);

            const [certFolders, setCertFolders] = useState([]);
            const [announcements, setAnnouncements] = useState([]);
            const [videos, setVideos] = useState([]);

            const [selectedCertFolder, setSelectedCertFolder] = useState(null);
            const [isFolderModalOpen, setIsFolderModalOpen] = useState(false);
            const [isCertUploadOpen, setIsCertUploadOpen] = useState(false);
            const [currentFolderForCert, setCurrentFolderForCert] = useState(null);

            const [newFolderTitle, setNewFolderTitle] = useState('');
            const [newFolderDesc, setNewFolderDesc] = useState('');
            const [newFolderShowHome, setNewFolderShowHome] = useState(false);

            const [newCertTitle, setNewCertTitle] = useState('');
            const [newCertUrl, setNewCertUrl] = useState('');

            const [newAnnounceTitle, setNewAnnounceTitle] = useState('');
            const [newAnnounceTag, setNewAnnounceTag] = useState('ทั่วไป');
            const [newAnnounceContent, setNewAnnounceContent] = useState('');

            const [newVideoTitle, setNewVideoTitle] = useState('');
            const [newVideoUrl, setNewVideoUrl] = useState('');

            useEffect(() => {
                if (isDarkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [isDarkMode]);

            // เชื่อมต่อ Firebase และดึงข้อมูลแบบ Real-time
            useEffect(() => {
                const checkFirebase = setInterval(() => {
                    if (window.firebaseApp) {
                        clearInterval(checkFirebase);
                        const { auth, signInAnonymously, onAuthStateChanged, signInWithCustomToken, db, collection, onSnapshot, query, orderBy } = window.firebaseApp;

                        const initAuth = async () => {
                            try {
                                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                                    await signInWithCustomToken(auth, __initial_auth_token);
                                } else {
                                    await signInAnonymously(auth);
                                }
                            } catch (e) {
                                console.warn("Auth initialization fallback:", e);
                            }
                        };
                        initAuth();

                        onAuthStateChanged(auth, (usr) => {
                            setUser(usr);
                        });

                        // โหลดข้อมูลโฟลเดอร์เกียรติบัตร
                        const unsubFolders = onSnapshot(collection(db, 'portfolio_folders'), (snapshot) => {
                            const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                            setCertFolders(data);
                        }, (err) => console.error("Error fetching folders:", err));

                        // โหลดข้อมูลประกาศ
                        const unsubAnn = onSnapshot(collection(db, 'portfolio_announcements'), (snapshot) => {
                            const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                            setAnnouncements(data);
                        }, (err) => console.error("Error fetching announcements:", err));

                        // โหลดข้อมูลวิดีโอ
                        const unsubVid = onSnapshot(collection(db, 'portfolio_videos'), (snapshot) => {
                            const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                            setVideos(data);
                        }, (err) => console.error("Error fetching videos:", err));

                        return () => {
                            unsubFolders();
                            unsubAnn();
                            unsubVid();
                        };
                    }
                }, 100);

                return () => clearInterval(checkFirebase);
            }, []);

            // อัปเดตข้อมูล selectedCertFolder เมื่อ certFolders เปลี่ยนแปลง
            useEffect(() => {
                if (selectedCertFolder) {
                    const updated = certFolders.find(f => f.id === selectedCertFolder.id);
                    if (updated) {
                        setSelectedCertFolder(updated);
                    }
                }
            }, [certFolders]);

            const handleLogin = (e) => {
                e.preventDefault();
                if (adminPassword === 'Yokk9044') {
                    setIsAdminLoggedIn(true);
                    setShowLoginModal(false);
                    setAdminPassword('');
                    setLoginError('');
                } else {
                    setLoginError('รหัสผ่านไม่ถูกต้อง!');
                }
            };

            const handleLogout = () => {
                setIsAdminLoggedIn(false);
            };

            const handleCreateFolder = async (e) => {
                e.preventDefault();
                if (!newFolderTitle || !window.firebaseApp) return;
                try {
                    const { db, collection, addDoc } = window.firebaseApp;
                    await addDoc(collection(db, 'portfolio_folders'), {
                        title: newFolderTitle,
                        description: newFolderDesc,
                        showOnHome: newFolderShowHome,
                        certificates: [],
                        createdAt: Date.now()
                    });
                    setNewFolderTitle('');
                    setNewFolderDesc('');
                    setNewFolderShowHome(false);
                    setIsFolderModalOpen(false);
                } catch (err) {
                    console.error("Error adding folder:", err);
                    alert("ไม่สามารถบันทึกโฟลเดอร์ได้ กรุณาตรวจสอบสิทธิ์ Firebase");
                }
            };

            const handleDeleteFolder = async (folderId) => {
                if (confirm('คุณแน่ใจหรือไม่ว่าต้องการลบโฟลเดอร์นี้และเกียรติบัตรข้างในทั้งหมด?')) {
                    try {
                        const { db, doc, deleteDoc } = window.firebaseApp;
                        await deleteDoc(doc(db, 'portfolio_folders', folderId));
                        if (selectedCertFolder && selectedCertFolder.id === folderId) {
                            setSelectedCertFolder(null);
                        }
                    } catch (err) {
                        console.error("Error deleting folder:", err);
                    }
                }
            };

            const toggleShowOnHome = async (folderId, currentStatus) => {
                try {
                    const { db, doc, updateDoc } = window.firebaseApp;
                    await updateDoc(doc(db, 'portfolio_folders', folderId), {
                        showOnHome: !currentStatus
                    });
                } catch (err) {
                    console.error("Error updating status:", err);
                }
            };

            const handleAddCertificate = async (e) => {
                e.preventDefault();
                if (!newCertTitle || !newCertUrl || !currentFolderForCert || !window.firebaseApp) return;

                if (currentFolderForCert.certificates.length >= 5) {
                    alert('โฟลเดอร์นี้อัปโหลดเกียรติบัตรครบ 5 ใบแล้ว!');
                    return;
                }

                try {
                    const updatedCerts = [
                        ...currentFolderForCert.certificates,
                        {
                            id: 'cert-' + Date.now(),
                            title: newCertTitle,
                            url: newCertUrl
                        }
                    ];

                    const { db, doc, updateDoc } = window.firebaseApp;
                    await updateDoc(doc(db, 'portfolio_folders', currentFolderForCert.id), {
                        certificates: updatedCerts
                    });

                    setNewCertTitle('');
                    setNewCertUrl('');
                    setIsCertUploadOpen(false);
                } catch (err) {
                    console.error("Error adding certificate:", err);
                }
            };

            const handleDeleteCert = async (folderId, certId) => {
                try {
                    const folder = certFolders.find(f => f.id === folderId);
                    if (!folder) return;
                    const updatedCerts = folder.certificates.filter(c => c.id !== certId);

                    const { db, doc, updateDoc } = window.firebaseApp;
                    await updateDoc(doc(db, 'portfolio_folders', folderId), {
                        certificates: updatedCerts
                    });
                } catch (err) {
                    console.error("Error deleting certificate:", err);
                }
            };

            const handleAddAnnouncement = async (e) => {
                e.preventDefault();
                if (!newAnnounceTitle || !window.firebaseApp) return;
                try {
                    const { db, collection, addDoc } = window.firebaseApp;
                    await addDoc(collection(db, 'portfolio_announcements'), {
                        title: newAnnounceTitle,
                        tag: newAnnounceTag,
                        content: newAnnounceContent,
                        date: new Date().toISOString().split('T')[0],
                        createdAt: Date.now()
                    });
                    setNewAnnounceTitle('');
                    setNewAnnounceContent('');
                } catch (err) {
                    console.error("Error adding announcement:", err);
                }
            };

            const handleDeleteAnnouncement = async (id) => {
                try {
                    const { db, doc, deleteDoc } = window.firebaseApp;
                    await deleteDoc(doc(db, 'portfolio_announcements', id));
                } catch (err) {
                    console.error("Error deleting announcement:", err);
                }
            };

            const handleAddVideo = async (e) => {
                e.preventDefault();
                if (!newVideoTitle || !newVideoUrl || !window.firebaseApp) return;
                
                let embed = newVideoUrl;
                if (newVideoUrl.includes('watch?v=')) {
                    embed = newVideoUrl.replace('watch?v=', 'embed/');
                } else if (newVideoUrl.includes('youtu.be/')) {
                    embed = newVideoUrl.replace('youtu.be/', 'www.youtube.com/embed/');
                }

                try {
                    const { db, collection, addDoc } = window.firebaseApp;
                    await addDoc(collection(db, 'portfolio_videos'), {
                        title: newVideoTitle,
                        embedUrl: embed,
                        category: 'คลิปกิจกรรม',
                        createdAt: Date.now()
                    });
                    setNewVideoTitle('');
                    setNewVideoUrl('');
                } catch (err) {
                    console.error("Error adding video:", err);
                }
            };

            const handleDeleteVideo = async (id) => {
                try {
                    const { db, doc, deleteDoc } = window.firebaseApp;
                    await deleteDoc(doc(db, 'portfolio_videos', id));
                } catch (err) {
                    console.error("Error deleting video:", err);
                }
            };

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Navigation Header */}
                    <nav className="bg-white/80 dark:bg-slate-900/80 backdrop-blur-md sticky top-0 z-40 border-b border-slate-200 dark:border-slate-800 px-4 lg:px-8 py-3 shadow-sm transition-colors duration-300">
                        <div className="max-w-7xl mx-auto flex justify-between items-center">
                            <div className="flex items-center gap-3 cursor-pointer" onClick={() => setActiveTab('home')}>
                                <div className="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center font-bold text-xl shadow-lg shadow-indigo-500/30 text-white">
                                    <i className="fa-solid fa-graduation-cap"></i>
                                </div>
                                <div>
                                    <h1 className="font-bold text-lg text-slate-900 dark:text-white leading-tight transition-colors">My Portfolio</h1>
                                    <p className="text-xs text-indigo-600 dark:text-indigo-400 font-medium">ระบบเกียรติบัตรส่วนบุคคล</p>
                                </div>
                            </div>

                            <div className="hidden md:flex items-center gap-1 bg-slate-100 dark:bg-slate-800/80 p-1.5 rounded-xl border border-slate-200 dark:border-slate-700/50 transition-colors">
                                <button 
                                    onClick={() => setActiveTab('home')}
                                    className={`px-4 py-2 rounded-lg text-sm font-medium transition-all ${activeTab === 'home' ? 'bg-indigo-600 text-white shadow' : 'text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white hover:bg-slate-200 dark:hover:bg-slate-700/50'}`}>
                                    <i className="fa-solid fa-house mr-2"></i>หน้าหลัก
                                </button>
                                <button 
                                    onClick={() => setActiveTab('certs')}
                                    className={`px-4 py-2 rounded-lg text-sm font-medium transition-all ${activeTab === 'certs' ? 'bg-indigo-600 text-white shadow' : 'text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white hover:bg-slate-200 dark:hover:bg-slate-700/50'}`}>
                                    <i className="fa-solid fa-folder-open mr-2"></i>แฟ้มเกียรติบัตร
                                </button>
                                <button 
                                    onClick={() => setActiveTab('announcements')}
                                    className={`px-4 py-2 rounded-lg text-sm font-medium transition-all ${activeTab === 'announcements' ? 'bg-indigo-600 text-white shadow' : 'text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white hover:bg-slate-200 dark:hover:bg-slate-700/50'}`}>
                                    <i className="fa-solid fa-bullhorn mr-2"></i>ประกาศ
                                </button>
                                <button 
                                    onClick={() => setActiveTab('videos')}
                                    className={`px-4 py-2 rounded-lg text-sm font-medium transition-all ${activeTab === 'videos' ? 'bg-indigo-600 text-white shadow' : 'text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white hover:bg-slate-200 dark:hover:bg-slate-700/50'}`}>
                                    <i className="fa-solid fa-circle-play mr-2"></i>คลิปผลงาน
                                </button>
                            </div>

                            <div className="flex items-center gap-3">
                                <button 
                                    onClick={() => setIsDarkMode(!isDarkMode)} 
                                    className="w-10 h-10 rounded-xl flex items-center justify-center text-slate-500 hover:bg-slate-200 dark:text-slate-400 dark:hover:bg-slate-800 transition-colors"
                                    title={isDarkMode ? "เปลี่ยนเป็นโหมดสว่าง" : "เปลี่ยนเป็นโหมดมืด"}>
                                    {isDarkMode ? <i className="fa-solid fa-sun text-lg text-amber-400"></i> : <i className="fa-solid fa-moon text-lg text-indigo-600"></i>}
                                </button>

                                {isAdminLoggedIn ? (
                                    <div className="flex items-center gap-2">
                                        <span className="hidden sm:flex bg-emerald-100 dark:bg-emerald-500/20 text-emerald-600 dark:text-emerald-400 text-xs px-3 py-1.5 rounded-full border border-emerald-200 dark:border-emerald-500/30 items-center gap-1.5 font-medium transition-colors">
                                            <span className="w-2 h-2 rounded-full bg-emerald-500 dark:bg-emerald-400 animate-pulse"></span>
                                            Admin
                                        </span>
                                        <button 
                                            onClick={handleLogout}
                                            className="px-3 py-1.5 bg-rose-100 dark:bg-rose-600/20 hover:bg-rose-500 dark:hover:bg-rose-600 text-rose-600 dark:text-rose-300 hover:text-white rounded-lg text-xs font-medium border border-rose-200 dark:border-rose-500/30 transition">
                                            <i className="fa-solid fa-right-from-bracket mr-1"></i>ออก
                                        </button>
                                    </div>
                                ) : (
                                    <button 
                                        onClick={() => setShowLoginModal(true)}
                                        className="px-4 py-2 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white rounded-xl text-sm font-medium shadow-md shadow-indigo-500/20 transition flex items-center gap-2">
                                        <i className="fa-solid fa-key"></i> <span className="hidden sm:inline">เข้าสู่ระบบเฉพาะฉัน</span>
                                    </button>
                                )}
                            </div>
                        </div>
                    </nav>

                    {/* Mobile Navigation bar */}
                    <div className="md:hidden bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-2 py-2 flex justify-around transition-colors">
                        <button onClick={() => setActiveTab('home')} className={`p-2 text-xs flex flex-col items-center ${activeTab === 'home' ? 'text-indigo-600 dark:text-indigo-400 font-bold' : 'text-slate-500 dark:text-slate-400'}`}>
                            <i className="fa-solid fa-house text-lg mb-1"></i>หน้าหลัก
                        </button>
                        <button onClick={() => setActiveTab('certs')} className={`p-2 text-xs flex flex-col items-center ${activeTab === 'certs' ? 'text-indigo-600 dark:text-indigo-400 font-bold' : 'text-slate-500 dark:text-slate-400'}`}>
                            <i className="fa-solid fa-folder-open text-lg mb-1"></i>เกียรติบัตร
                        </button>
                        <button onClick={() => setActiveTab('announcements')} className={`p-2 text-xs flex flex-col items-center ${activeTab === 'announcements' ? 'text-indigo-600 dark:text-indigo-400 font-bold' : 'text-slate-500 dark:text-slate-400'}`}>
                            <i className="fa-solid fa-bullhorn text-lg mb-1"></i>ประกาศ
                        </button>
                        <button onClick={() => setActiveTab('videos')} className={`p-2 text-xs flex flex-col items-center ${activeTab === 'videos' ? 'text-indigo-600 dark:text-indigo-400 font-bold' : 'text-slate-500 dark:text-slate-400'}`}>
                            <i className="fa-solid fa-circle-play text-lg mb-1"></i>คลิป
                        </button>
                    </div>

                    {/* HERO BOARD (TOP BOARD) */}
                    <div className="bg-gradient-to-br from-indigo-50 via-purple-50 to-blue-50 dark:from-slate-900 dark:via-indigo-950 dark:to-slate-900 py-10 px-4 border-b border-indigo-100 dark:border-slate-800 relative overflow-hidden transition-colors duration-500">
                        <div className="absolute -top-24 -right-24 w-96 h-96 bg-indigo-500/20 dark:bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>
                        <div className="absolute -bottom-24 -left-24 w-96 h-96 bg-purple-500/20 dark:bg-purple-500/10 rounded-full blur-3xl pointer-events-none"></div>

                        <div className="max-w-7xl mx-auto flex flex-col md:flex-row items-center gap-8 relative z-10">
                            <div className="relative group">
                                <div className="w-32 h-32 md:w-40 md:h-40 rounded-3xl overflow-hidden border-4 border-white dark:border-indigo-500/30 shadow-xl dark:shadow-2xl bg-white dark:bg-slate-800 flex items-center justify-center transition-colors">
                                    <img src={MY_PROFILE.avatarUrl} alt="รูปโปรไฟล์" className="w-full h-full object-cover" />
                                </div>
                                <span className="absolute bottom-2 right-2 w-5 h-5 bg-emerald-500 border-2 border-white dark:border-slate-900 rounded-full shadow-md" title="พร้อมสำหรับการประเมิน"></span>
                            </div>

                            <div className="flex-1 text-center md:text-left">
                                <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-100 dark:bg-indigo-500/10 border border-indigo-200 dark:border-indigo-500/20 text-indigo-700 dark:text-indigo-300 text-xs font-medium mb-3 transition-colors">
                                    <i className="fa-solid fa-school"></i> {MY_PROFILE.tag}
                                </div>
                                <h1 className="text-3xl md:text-4xl font-extrabold text-slate-900 dark:text-white tracking-tight transition-colors">
                                    {MY_PROFILE.name} <span className="text-indigo-600 dark:text-indigo-400 text-2xl font-normal block md:inline mt-1 md:mt-0">{MY_PROFILE.subtitle}</span>
                                </h1>
                                <p className="text-slate-600 dark:text-slate-300 mt-3 text-sm md:text-base max-w-2xl leading-relaxed transition-colors">
                                    {MY_PROFILE.description}
                                </p>

                                <div className="flex flex-wrap items-center justify-center md:justify-start gap-3 mt-5 text-xs text-slate-600 dark:text-slate-400">
                                    <span className="flex items-center gap-1.5 bg-white/60 dark:bg-slate-800/80 px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700/50 shadow-sm transition-colors">
                                        <i className="fa-solid fa-award text-amber-500 dark:text-amber-400"></i> โฟลเดอร์: {certFolders.length} หมวด
                                    </span>
                                    <span className="flex items-center gap-1.5 bg-white/60 dark:bg-slate-800/80 px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700/50 shadow-sm transition-colors">
                                        <i className="fa-solid fa-file-certificate text-indigo-500 dark:text-indigo-400"></i> รูปเกียรติบัตร: {certFolders.reduce((acc, f) => acc + (f.certificates ? f.certificates.length : 0), 0)} ใบ
                                    </span>
                                    <span className="flex items-center gap-1.5 bg-white/60 dark:bg-slate-800/80 px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700/50 shadow-sm transition-colors">
                                        <i className="fa-solid fa-video text-purple-500 dark:text-purple-400"></i> วิดีโอ: {videos.length} คลิป
                                    </span>
                                </div>
                            </div>

                            {!isAdminLoggedIn && (

                                        value={newFolderTitle}
                                        onChange={(e) => setNewFolderTitle(e.target.value)}
                                        className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-xs"
                                    />
                                    <textarea 
                                        placeholder="คำอธิบายโฟลเดอร์ (ย่อ)" 
                                        value={newFolderDesc}
                                        onChange={(e) => setNewFolderDesc(e.target.value)}
                                        className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-xs h-20"
                                    ></textarea>
                                    <label className="flex items-center gap-2 text-xs text-slate-600 dark:text-slate-300">
                                        <input 
                                            type="checkbox" 
                                            checked={newFolderShowHome}
                                            onChange={(e) => setNewFolderShowHome(e.target.checked)}
                                        />
                                        แสดงปักหมุดที่หน้าแรก
                                    </label>
                                    <div className="flex justify-end gap-2">
                                        <button type="button" onClick={() => setIsFolderModalOpen(false)} className="px-3 py-1.5 text-xs text-slate-500">ยกเลิก</button>
                                        <button type="submit" className="px-4 py-1.5 bg-indigo-600 text-white rounded-xl text-xs font-medium">สร้าง</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL: Upload Certificate */}
                    {isCertUploadOpen && (
                        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white dark:bg-slate-800 w-full max-w-sm rounded-3xl p-6 shadow-2xl border border-slate-200 dark:border-slate-700">
                                <h3 className="font-bold text-lg text-slate-900 dark:text-white mb-4">เพิ่มเกียรติบัตร</h3>
                                <form onSubmit={handleAddCertificate} className="space-y-4">
                                    <input 
                                        type="text" 
                                        placeholder="ชื่อเกียรติบัตร" 
                                        value={newCertTitle}
                                        onChange={(e) => setNewCertTitle(e.target.value)}
                                        className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-xs"
                                    />
                                    <input 
                                        type="text" 
                                        placeholder="ลิงก์รูปภาพ (.jpg/.png)" 
                                        value={newCertUrl}
                                        onChange={(e) => setNewCertUrl(e.target.value)}
                                        className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-xs"
                                    />
                                    <div className="flex justify-end gap-2">
                                        <button type="button" onClick={() => setIsCertUploadOpen(false)} className="px-3 py-1.5 text-xs text-slate-500">ยกเลิก</button>
                                        <button type="submit" className="px-4 py-1.5 bg-indigo-600 text-white rounded-xl text-xs font-medium">อัปโหลด</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
