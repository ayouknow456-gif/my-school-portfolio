<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Web</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {}
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body {
            font-family: 'Kanit', sans-serif;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.5);
            border-radius: 4px;
        }
        .image-preview {
            max-height: 300px;
            object-fit: contain;
        }
    </style>
</head>
<body class="min-h-screen custom-scrollbar bg-slate-50 dark:bg-[#0f172a] text-slate-800 dark:text-[#f8fafc] transition-colors duration-300">
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDocs, addDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCk01n1Kwg_vss31jqM937DvH5rhONQ3sk",
            authDomain: "verify-bot-1fb01.firebaseapp.com",
            projectId: "verify-bot-1fb01",
            storageBucket: "verify-bot-1fb01.firebasestorage.app",
            messagingSenderId: "902200428070",
            appId: "1:902200428070:web:9214e5a6a3ba3b0f60c8e7",
            measurementId: "G-EP8S5H2HH2"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        window.firebaseApp = { app, auth, db, storage, signInWithCustomToken, signInAnonymously, onAuthStateChanged, signOut, collection, doc, setDoc, getDocs, addDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy, ref, uploadBytes, getDownloadURL, deleteObject };
    </script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        let DEFAULT_PROFILE = {
            name: "ด.ช. ธนัชชัย *******",
            subtitle: "อ่านเบิ่ง",
            description: "ยินดีต้อนรับสู่บอร์ดผลงานส่วนบุคคล รวบรวมเกียรติบัตร กิจกรรม และโครงงานต่างๆ ของฉัน",
            tag: "แฟ้มสะสมผลงานและเกียรติบัตรนักเรียน",
            avatarUrl: "https://i.postimg.cc/YSkSswXK/763308317-1075293791678427-2332511763279306518-n.jpg"
        };

        function App() {
            const [user, setUser] = useState(null);
            const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);
            const [activeTab, setActiveTab] = useState('home');
            const [showLoginModal, setShowLoginModal] = useState(false);
            const [adminPassword, setAdminPassword] = useState('');
            const [loginError, setLoginError] = useState('');
            
            const [isDarkMode, setIsDarkMode] = useState(true);
            const [profile, setProfile] = useState(DEFAULT_PROFILE);
            const [isEditProfileOpen, setIsEditProfileOpen] = useState(false);
            const [editProfileData, setEditProfileData] = useState({...DEFAULT_PROFILE});
            const [profileAvatarPreview, setProfileAvatarPreview] = useState(null);
            const [isUploadingProfile, setIsUploadingProfile] = useState(false);

            const [certFolders, setCertFolders] = useState([]);
            const [announcements, setAnnouncements] = useState([]);
            const [videos, setVideos] = useState([]);

            const [selectedCertFolder, setSelectedCertFolder] = useState(null);
            const [isFolderModalOpen, setIsFolderModalOpen] = useState(false);
            const [isCertUploadOpen, setIsCertUploadOpen] = useState(false);
            const [currentFolderForCert, setCurrentFolderForCert] = useState(null);

            const [newFolderTitle, setNewFolderTitle] = useState('');
            const [newFolderDesc, setNewFolderDesc] = useState('');
            const [newFolderShowHome, setNewFolderShowHome] = useState(false);

            const [newCertTitle, setNewCertTitle] = useState('');
            const [newCertUrl, setNewCertUrl] = useState('');
            const [certImagePreview, setCertImagePreview] = useState(null);
            const [isUploadingCert, setIsUploadingCert] = useState(false);

            const [newAnnounceTitle, setNewAnnounceTitle] = useState('');
            const [newAnnounceTag, setNewAnnounceTag] = useState('ทั่วไป');
            const [newAnnounceContent, setNewAnnounceContent] = useState('');

            const [newVideoTitle, setNewVideoTitle] = useState('');
            const [newVideoUrl, setNewVideoUrl] = useState('');

            useEffect(() => {
                if (isDarkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [isDarkMode]);

            // Load profile from Firestore
            useEffect(() => {
                const checkFirebase = setInterval(() => {
                    if (window.firebaseApp) {
                        clearInterval(checkFirebase);
                        const { auth, signInAnonymously, onAuthStateChanged, signInWithCustomToken, db, collection, onSnapshot, query, orderBy, doc } = window.firebaseApp;

                        const initAuth = async () => {
                            try {
                                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                                    await signInWithCustomToken(auth, __initial_auth_token);
                                } else {
                                    await signInAnonymously(auth);
                                }
                            } catch (e) {
                                console.warn("Auth initialization fallback:", e);
                            }
                        };
                        initAuth();

                        onAuthStateChanged(auth, (usr) => {
                            setUser(usr);
                        });

                        // Load profile
                        const unsubProfile = onSnapshot(doc(db, 'portfolio_settings', 'profile'), (doc) => {
                            if (doc.exists()) {
                                setProfile(doc.data());
                                setEditProfileData(doc.data());
                            }
                        }, (err) => console.warn("Profile not found, using default"));

                        // Load folders
                        const unsubFolders = onSnapshot(collection(db, 'portfolio_folders'), (snapshot) => {
                            const data = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                            setCertFolders(data);
                        }, (err) => console.error("Error fetching folders:", err));

                        // Load announcements
                        const unsubAnn = onSnapshot(collection(db, 'portfolio_announcements'), (snapshot) => {
                            const data = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                            setAnnouncements(data);
                        }, (err) => console.error("Error fetching announcements:", err));

                        // Load videos
                        const unsubVid = onSnapshot(collection(db, 'portfolio_videos'), (snapshot) => {
                            const data = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                            setVideos(data);
                        }, (err) => console.error("Error fetching videos:", err));

                        return () => {
                            unsubProfile();
                            unsubFolders();
                            unsubAnn();
                            unsubVid();
                        };
                    }
                }, 100);

                return () => clearInterval(checkFirebase);
            }, []);

            // Handle Profile Avatar Upload
            const handleProfileAvatarChange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        setProfileAvatarPreview(event.target.result);
                    };
                    reader.readAsDataURL(file);
                    e.target.dataset.file = file;
                }
            };

            // Save Profile
            const handleSaveProfile = async (e) => {
                e.preventDefault();
                setIsUploadingProfile(true);
                try {
                    let avatarUrl = editProfileData.avatarUrl;

                    // Upload avatar if changed
                    if (profileAvatarPreview && profileAvatarPreview !== profile.avatarUrl) {
                        const fileInput = document.getElementById('profileAvatarInput');
                        const file = fileInput.files[0];
                        if (file && window.firebaseApp) {
                            const { storage, ref, uploadBytes, getDownloadURL } = window.firebaseApp;
                            const storageRef = ref(storage, `profile/avatar-${Date.now()}`);
                            await uploadBytes(storageRef, file);
                            avatarUrl = await getDownloadURL(storageRef);
                        }
                    }

                    const { db, doc, setDoc } = window.firebaseApp;
                    await setDoc(doc(db, 'portfolio_settings', 'profile'), {
                        ...editProfileData,
                        avatarUrl: avatarUrl
                    });

                    setProfile({...editProfileData, avatarUrl});
                    setProfileAvatarPreview(null);
                    setIsEditProfileOpen(false);
                } catch (err) {
                    console.error("Error saving profile:", err);
                    alert("ไม่สามารถบันทึกโปรไฟล์ได้");
                } finally {
                    setIsUploadingProfile(false);
                }
            };

            const handleLogin = (e) => {
                e.preventDefault();
                if (adminPassword === 'Yokk9044') {
                    setIsAdminLoggedIn(true);
                    setShowLoginModal(false);
                    setAdminPassword('');
                    setLoginError('');
                } else {
                    setLoginError('รหัสผ่านไม่ถูกต้อง!');
                }
            };

            const handleLogout = () => {
                setIsAdminLoggedIn(false);
            };

            const handleCreateFolder = async (e) => {
                e.preventDefault();
                if (!newFolderTitle || !window.firebaseApp) return;
                try {
                    const { db, collection, addDoc } = window.firebaseApp;
                    await addDoc(collection(db, 'portfolio_folders'), {
                        title: newFolderTitle,
                        description: newFolderDesc,
                        showOnHome: newFolderShowHome,
                        certificates: [],
                        createdAt: Date.now()
                    });
                    setNewFolderTitle('');
                    setNewFolderDesc('');
                    setNewFolderShowHome(false);
                    setIsFolderModalOpen(false);
                } catch (err) {
                    console.error("Error adding folder:", err);
                    alert("ไม่สามารถบันทึกโฟลเดอร์ได้");
                }
            };

            const handleDeleteFolder = async (folderId) => {
                if (confirm('คุณแน่ใจหรือไม่ว่าต้องการลบโฟลเดอร์นี้และเกียรติบัตรข้างในทั้งหมด?')) {
                    try {
                        const { db, doc, deleteDoc } = window.firebaseApp;
                        await deleteDoc(doc(db, 'portfolio_folders', folderId));
                        if (selectedCertFolder && selectedCertFolder.id === folderId) {
                            setSelectedCertFolder(null);
                        }
                    } catch (err) {
                        console.error("Error deleting folder:", err);
                    }
                }
            };

            const toggleShowOnHome = async (folderId, currentStatus) => {
                try {
                    const { db, doc, updateDoc } = window.firebaseApp;
                    await updateDoc(doc(db, 'portfolio_folders', folderId), {
                        showOnHome: !currentStatus
                    });
                } catch (err) {
                    console.error("Error updating status:", err);
                }
            };

            // Handle Certificate Image Upload
            const handleCertImageChange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        setCertImagePreview(event.target.result);
                        setNewCertUrl(event.target.result);
                    };
                    reader.readAsDataURL(file);
                    e.target.dataset.file = file;
                }
            };

            const handleAddCertificate = async (e) => {
                e.preventDefault();
                if (!newCertTitle || !newCertUrl || !currentFolderForCert || !window.firebaseApp) return;

                if (currentFolderForCert.certificates && currentFolderForCert.certificates.length >= 10) {
                    alert('โฟลเดอร์นี้อัปโหลดเกียรติบัตรครบ 10 ใบแล้ว!');
                    return;
                }

                setIsUploadingCert(true);
                try {
                    let imageUrl = newCertUrl;

                    // Upload image if it's a file (not URL)
                    if (certImagePreview && newCertUrl === certImagePreview) {
                        const fileInput = document.getElementById('certImageInput');
                        const file = fileInput.files[0];
                        if (file) {
                            const { storage, ref, uploadBytes, getDownloadURL } = window.firebaseApp;
                            const storageRef = ref(storage, `certificates/${currentFolderForCert.id}/${Date.now()}-${file.name}`);
                            await uploadBytes(storageRef, file);
                            imageUrl = await getDownloadURL(storageRef);
                        }
                    }

                    const updatedCerts = [
                        ...(currentFolderForCert.certificates || []),
                        {
                            id: 'cert-' + Date.now(),
                            title: newCertTitle,
                            url: imageUrl
                        }
                    ];

                    const { db, doc, updateDoc } = window.firebaseApp;
                    await updateDoc(doc(db, 'portfolio_folders', currentFolderForCert.id), {
                        certificates: updatedCerts
                    });

                    setNewCertTitle('');
                    setNewCertUrl('');
                    setCertImagePreview(null);
                    setIsCertUploadOpen(false);
                } catch (err) {
                    console.error("Error adding certificate:", err);
                    alert("ไม่สามารถอัปโหลดเกียรติบัตรได้");
                } finally {
                    setIsUploadingCert(false);
                }
            };

            const handleDeleteCert = async (folderId, certId) => {
                try {
                    const folder = certFolders.find(f => f.id === folderId);
                    if (!folder) return;
                    const updatedCerts = (folder.certificates || []).filter(c => c.id !== certId);

                    const { db, doc, updateDoc } = window.firebaseApp;
                    await updateDoc(doc(db, 'portfolio_folders', folderId), {
                        certificates: updatedCerts
                    });
                } catch (err) {
                    console.error("Error deleting certificate:", err);
                }
            };

            const handleAddAnnouncement = async (e) => {
                e.preventDefault();
                if (!newAnnounceTitle || !window.firebaseApp) return;
                try {
                    const { db, collection, addDoc } = window.firebaseApp;
                    await addDoc(collection(db, 'portfolio_announcements'), {
                        title: newAnnounceTitle,
                        tag: newAnnounceTag,
                        content: newAnnounceContent,
                        date: new Date().toISOString().split('T')[0],
                        createdAt: Date.now()
                    });
                    setNewAnnounceTitle('');
                    setNewAnnounceContent('');
                } catch (err) {
                    console.error("Error adding announcement:", err);
                }
            };

            const handleDeleteAnnouncement = async (id) => {
                try {
                    const { db, doc, deleteDoc } = window.firebaseApp;
                    await deleteDoc(doc(db, 'portfolio_announcements', id));
                } catch (err) {
                    console.error("Error deleting announcement:", err);
                }
            };

            const handleAddVideo = async (e) => {
                e.preventDefault();
                if (!newVideoTitle || !newVideoUrl || !window.firebaseApp) return;
                
                let embed = newVideoUrl;
                if (newVideoUrl.includes('watch?v=')) {
                    embed = newVideoUrl.replace('watch?v=', 'embed/');
                } else if (newVideoUrl.includes('youtu.be/')) {
                    embed = newVideoUrl.replace('youtu.be/', 'www.youtube.com/embed/');
                }

                try {
                    const { db, collection, addDoc } = window.firebaseApp;
                    await addDoc(collection(db, 'portfolio_videos'), {
                        title: newVideoTitle,
                        embedUrl: embed,
                        category: 'คลิปกิจกรรม',
                        createdAt: Date.now()
                    });
                    setNewVideoTitle('');
                    setNewVideoUrl('');
                } catch (err) {
                    console.error("Error adding video:", err);
                }
            };

            const handleDeleteVideo = async (id) => {
                try {
                    const { db, doc, deleteDoc } = window.firebaseApp;
                    await deleteDoc(doc(db, 'portfolio_videos', id));
                } catch (err) {
                    console.error("Error deleting video:", err);
                }
            };

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Navigation Header */}
                    <nav className="bg-white/80 dark:bg-slate-900/80 backdrop-blur-md sticky top-0 z-40 border-b border-slate-200 dark:border-slate-800 px-4 lg:px-8 py-3 shadow-sm transition-colors duration-300">
                        <div className="max-w-7xl mx-auto flex justify-between items-center">
                            <div className="flex items-center gap-3 cursor-pointer" onClick={() => setActiveTab('home')}>
                                <div className="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center font-bold text-xl shadow-lg shadow-indigo-500/30 text-white">
                                    <i className="fa-solid fa-graduation-cap"></i>
                                </div>
                                <div>
                                    <h1 className="font-bold text-lg text-slate-900 dark:text-white leading-tight transition-colors">My Portfolio</h1>
                                    <p className="text-xs text-indigo-600 dark:text-indigo-400 font-medium">ระบบเกียรติบัตรส่วนบุคคล</p>
                                </div>
                            </div>

                            <div className="hidden md:flex items-center gap-1 bg-slate-100 dark:bg-slate-800/80 p-1.5 rounded-xl border border-slate-200 dark:border-slate-700/50 transition-colors">
                                <button 
                                    onClick={() => setActiveTab('home')}
                                    className={`px-4 py-2 rounded-lg text-sm font-medium transition-all ${activeTab === 'home' ? 'bg-indigo-600 text-white shadow' : 'text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white hover:bg-slate-200 dark:hover:bg-slate-700/50'}`}>
                                    <i className="fa-solid fa-house mr-2"></i>หน้าหลัก
                                </button>
                                <button 
                                    onClick={() => setActiveTab('certs')}
                                    className={`px-4 py-2 rounded-lg text-sm font-medium transition-all ${activeTab === 'certs' ? 'bg-indigo-600 text-white shadow' : 'text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white hover:bg-slate-200 dark:hover:bg-slate-700/50'}`}>
                                    <i className="fa-solid fa-folder-open mr-2"></i>แฟ้มเกียรติบัตร
                                </button>
                                <button 
                                    onClick={() => setActiveTab('announcements')}
                                    className={`px-4 py-2 rounded-lg text-sm font-medium transition-all ${activeTab === 'announcements' ? 'bg-indigo-600 text-white shadow' : 'text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white hover:bg-slate-200 dark:hover:bg-slate-700/50'}`}>
                                    <i className="fa-solid fa-bullhorn mr-2"></i>ประกาศ
                                </button>
                                <button 
                                    onClick={() => setActiveTab('videos')}
                                    className={`px-4 py-2 rounded-lg text-sm font-medium transition-all ${activeTab === 'videos' ? 'bg-indigo-600 text-white shadow' : 'text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white hover:bg-slate-200 dark:hover:bg-slate-700/50'}`}>
                                    <i className="fa-solid fa-circle-play mr-2"></i>คลิปผลงาน
                                </button>
                            </div>

                            <div className="flex items-center gap-3">
                                <button 
                                    onClick={() => setIsDarkMode(!isDarkMode)} 
                                    className="w-10 h-10 rounded-xl flex items-center justify-center text-slate-500 hover:bg-slate-200 dark:text-slate-400 dark:hover:bg-slate-800 transition-colors"
                                    title={isDarkMode ? "เปลี่ยนเป็นโหมดสว่าง" : "เปลี่ยนเป็นโหมดมืด"}>
                                    {isDarkMode ? <i className="fa-solid fa-sun text-lg text-amber-400"></i> : <i className="fa-solid fa-moon text-lg text-indigo-600"></i>}
                                </button>

                                {isAdminLoggedIn ? (
                                    <button 
                                        onClick={handleLogout}
                                        className="px-4 py-2 rounded-lg text-sm font-medium bg-red-500/20 text-red-600 hover:bg-red-500/30 transition-colors">
                                        <i className="fa-solid fa-sign-out mr-2"></i>ออกจากระบบ
                                    </button>
                                ) : (
                                    <button 
                                        onClick={() => setShowLoginModal(true)}
                                        className="px-4 py-2 rounded-lg text-sm font-medium bg-indigo-600 text-white hover:bg-indigo-700 transition-colors">
                                        <i className="fa-solid fa-lock mr-2"></i>ผู้ดูแล
                                    </button>
                                )}
                            </div>
                        </div>
                    </nav>

                    {/* Main Content */}
                    <main className="flex-1 max-w-7xl mx-auto w-full px-4 lg:px-8 py-8">
                        {/* HOME TAB */}
                        {activeTab === 'home' && (
                            <div className="space-y-8">
                                {/* Profile Section */}
                                <div className="relative">
                                    <div className="h-48 bg-gradient-to-r from-indigo-600 to-blue-600 rounded-2xl"></div>
                                    <div className="flex flex-col md:flex-row gap-6 px-6 pt-6 pb-6 bg-white dark:bg-slate-800 rounded-2xl -mt-24 relative z-10 ml-6 mr-6">
                                        <img src={profile.avatarUrl} alt={profile.name} className="w-40 h-40 rounded-2xl object-cover border-4 border-white dark:border-slate-800 shadow-lg" />
                                        <div className="flex-1 pt-4">
                                            <h2 className="text-3xl font-bold text-slate-900 dark:text-white mb-2">{profile.name}</h2>
                                            <p className="text-lg text-indigo-600 dark:text-indigo-400 mb-4">{profile.subtitle}</p>
                                            <p className="text-slate-600 dark:text-slate-300 mb-4">{profile.description}</p>
                                            <div className="inline-block px-4 py-2 bg-indigo-100 dark:bg-indigo-900/30 text-indigo-700 dark:text-indigo-300 rounded-lg text-sm">
                                                {profile.tag}
                                            </div>
                                        </div>
                                        {isAdminLoggedIn && (
                                            <button 
                                                onClick={() => {
                                                    setIsEditProfileOpen(true);
                                                    setEditProfileData({...profile});
                                                    setProfileAvatarPreview(null);
                                                }}
                                                className="self-start md:self-end px-6 py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors">
                                                <i className="fa-solid fa-edit mr-2"></i>แก้ไขโปรไฟล์
                                            </button>
                                        )}
                                    </div>
                                </div>

                                {/* Show featured certificates */}
                                {certFolders.filter(f => f.showOnHome).length > 0 && (
                                    <div>
                                        <h3 className="text-2xl font-bold text-slate-900 dark:text-white mb-6">เกียรติบัตรโดดเด่น</h3>
                                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                            {certFolders.filter(f => f.showOnHome).map(folder => (
                                                <div key={folder.id} className="bg-white dark:bg-slate-800 rounded-xl p-6 shadow-md hover:shadow-lg transition-shadow">
                                                    <h4 className="font-bold text-slate-900 dark:text-white mb-2">{folder.title}</h4>
                                                    <p className="text-sm text-slate-600 dark:text-slate-400 mb-4">{folder.description}</p>
                                                    <p className="text-xs text-indigo-600 dark:text-indigo-400">เกียรติบัตร: {(folder.certificates || []).length} ใบ</p>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* CERTIFICATES TAB */}
                        {activeTab === 'certs' && (
                            <div className="space-y-8">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-3xl font-bold text-slate-900 dark:text-white">แฟ้มเกียรติบัตร</h2>
                                    {isAdminLoggedIn && (
                                        <button 
                                            onClick={() => setIsFolderModalOpen(true)}
                                            className="px-6 py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors">
                                            <i className="fa-solid fa-plus mr-2"></i>สร้างโฟลเดอร์
                                        </button>
                                    )}
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {certFolders.map(folder => (
                                        <div key={folder.id} className="bg-white dark:bg-slate-800 rounded-xl p-6 shadow-md hover:shadow-lg transition-shadow cursor-pointer" onClick={() => setSelectedCertFolder(folder)}>
                                            <div className="flex justify-between items-start mb-4">
                                                <h3 className="font-bold text-lg text-slate-900 dark:text-white">{folder.title}</h3>
                                                {isAdminLoggedIn && (
                                                    <div className="flex gap-2">
                                                        <button 
                                                            onClick={(e) => {
                                                                e.stopPropagation();
                                                                toggleShowOnHome(folder.id, folder.showOnHome);
                                                            }}
                                                            className={`px-2 py-1 text-xs rounded ${folder.showOnHome ? 'bg-green-500/20 text-green-600' : 'bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-400'}`}>
                                                            {folder.showOnHome ? 'แสดง' : 'ซ่อน'}
                                                        </button>
                                                        <button 
                                                            onClick={(e) => {
                                                                e.stopPropagation();
                                                                handleDeleteFolder(folder.id);
                                                            }}
                                                            className="px-2 py-1 text-xs bg-red-500/20 text-red-600 rounded hover:bg-red-500/30 transition-colors">
                                                            <i className="fa-solid fa-trash"></i>
                                                        </button>
                                                    </div>
                                                )}
                                            </div>
                                            <p className="text-sm text-slate-600 dark:text-slate-400 mb-4">{folder.description}</p>
                                            <p className="text-sm font-medium text-indigo-600 dark:text-indigo-400">เกียรติบัตร: {(folder.certificates || []).length} ใบ</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* ANNOUNCEMENTS TAB */}
                        {activeTab === 'announcements' && (
                            <div className="space-y-8">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-3xl font-bold text-slate-900 dark:text-white">ประกาศ</h2>
                                    {isAdminLoggedIn && (
                                        <button 
                                            onClick={() => setActiveTab('announcements')}
                                            className="px-6 py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors">
                                            <i className="fa-solid fa-plus mr-2"></i>เพิ่มประกาศ
                                        </button>
                                    )}
                                </div>

                                {isAdminLoggedIn && (
                                    <form onSubmit={handleAddAnnouncement} className="bg-white dark:bg-slate-800 rounded-xl p-6 shadow-md">
                                        <input 
                                            type="text" 
                                            placeholder="หัวข้อประกาศ"
                                            value={newAnnounceTitle}
                                            onChange={(e) => setNewAnnounceTitle(e.target.value)}
                                            className="w-full px-4 py-3 rounded-lg border border-slate-200 dark:border-slate-700 dark:bg-slate-900 dark:text-white mb-4"
                                        />
                                        <select 
                                            value={newAnnounceTag}
                                            onChange={(e) => setNewAnnounceTag(e.target.value)}
                                            className="w-full px-4 py-3 rounded-lg border border-slate-200 dark:border-slate-700 dark:bg-slate-900 dark:text-white mb-4">
                                            <option>ทั่วไป</option>
                                            <option>สำคัญ</option>
                                            <option>กิจกรรม</option>
                                        </select>
                                        <textarea 
                                            placeholder="เนื้อหาประกาศ"
                                            value={newAnnounceContent}
                                            onChange={(e) => setNewAnnounceContent(e.target.value)}
                                            rows="4"
                                            className="w-full px-4 py-3 rounded-lg border border-slate-200 dark:border-slate-700 dark:bg-slate-900 dark:text-white mb-4">
                                        </textarea>
                                        <button type="submit" className="w-full px-6 py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors font-medium">
                                            บันทึกประกาศ
                                        </button>
                                    </form>
                                )}

                                <div className="space-y-4">
                                    {announcements.map(ann => (
                                        <div key={ann.id} className="bg-white dark:bg-slate-800 rounded-xl p-6 shadow-md">
                                            <div className="flex justify-between items-start mb-2">
                                                <h3 className="font-bold text-lg text-slate-900 dark:text-white">{ann.title}</h3>
                                                {isAdminLoggedIn && (
                                                    <button 
                                                        onClick={() => handleDeleteAnnouncement(ann.id)}
                                                        className="px-3 py-1 text-sm bg-red-500/20 text-red-600 rounded hover:bg-red-500/30">
                                                        <i className="fa-solid fa-trash"></i>
                                                    </button>
                                                )}
                                            </div>
                                            <div className="flex gap-2 mb-3">
                                                <span className="px-3 py-1 bg-indigo-100 dark:bg-indigo-900/30 text-indigo-700 dark:text-indigo-300 rounded text-xs">{ann.tag}</span>
                                                <span className="text-xs text-slate-500 dark:text-slate-400">{ann.date}</span>
                                            </div>
                                            <p className="text-slate-600 dark:text-slate-300">{ann.content}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* VIDEOS TAB */}
                        {activeTab === 'videos' && (
                            <div className="space-y-8">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-3xl font-bold text-slate-900 dark:text-white">คลิปผลงาน</h2>
                                    {isAdminLoggedIn && (
                                        <button 
                                            onClick={() => setActiveTab('videos')}
                                            className="px-6 py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors">
                                            <i className="fa-solid fa-plus mr-2"></i>เพิ่มวิดีโอ
                                        </button>
                                    )}
                                </div>

                                {isAdminLoggedIn && (
                                    <form onSubmit={handleAddVideo} className="bg-white dark:bg-slate-800 rounded-xl p-6 shadow-md">
                                        <input 
                                            type="text" 
                                            placeholder="ชื่อวิดีโอ"
                                            value={newVideoTitle}
                                            onChange={(e) => setNewVideoTitle(e.target.value)}
                                            className="w-full px-4 py-3 rounded-lg border border-slate-200 dark:border-slate-700 dark:bg-slate-900 dark:text-white mb-4"
                                        />
                                        <input 
                                            type="text" 
                                            placeholder="ลิงก์ YouTube (เช่น https://youtube.com/watch?v=...)"
                                            value={newVideoUrl}
                                            onChange={(e) => setNewVideoUrl(e.target.value)}
                                            className="w-full px-4 py-3 rounded-lg border border-slate-200 dark:border-slate-700 dark:bg-slate-900 dark:text-white mb-4"
                                        />
                                        <button type="submit" className="w-full px-6 py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors font-medium">
                                            บันทึกวิดีโอ
                                        </button>
                                    </form>
                                )}

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    {videos.map(vid => (
                                        <div key={vid.id} className="bg-white dark:bg-slate-800 rounded-xl overflow-hidden shadow-md">
                                            <div className="aspect-video bg-black">
                                                <iframe 
                                                    width="100%" 
                                                    height="100%" 
                                                    src={vid.embedUrl} 
                                                    frameBorder="0" 
                                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                                    allowFullScreen>
                                                </iframe>
                                            </div>
                                            <div className="p-4">
                                                <h3 className="font-bold text-slate-900 dark:text-white mb-2">{vid.title}</h3>
                                                {isAdminLoggedIn && (
                                                    <button 
                                                        onClick={() => handleDeleteVideo(vid.id)}
                                                        className="px-3 py-1 text-sm bg-red-500/20 text-red-600 rounded hover:bg-red-500/30">
                                                        <i className="fa-solid fa-trash mr-2"></i>ลบ
                                                    </button>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* LOGIN MODAL */}
                    {showLoginModal && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50">
                            <div className="bg-white dark:bg-slate-800 rounded-2xl p-8 shadow-2xl max-w-md w-full mx-4">
                                <h2 className="text-2xl font-bold text-slate-900 dark:text-white mb-6">เข้าสู่ระบบผู้ดูแล</h2>
                                <form onSubmit={handleLogin}>
                                    <input 
                                        type="password" 
                                        placeholder="รหัสผ่าน"
                                        value={adminPassword}
                                        onChange={(e) => setAdminPassword(e.target.value)}
                                        className="w-full px-4 py-3 rounded-lg border border-slate-200 dark:border-slate-700 dark:bg-slate-900 dark:text-white mb-4"
                                    />
                                    {loginError && <p className="text-red-500 text-sm mb-4">{loginError}</p>}
                                    <button type="submit" className="w-full px-6 py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors font-medium mb-2">
                                        เข้าสู่ระบบ
                                    </button>
                                    <button type="button" onClick={() => setShowLoginModal(false)} className="w-full px-6 py-3 bg-slate-200 dark:bg-slate-700 text-slate-900 dark:text-white rounded-lg hover:bg-slate-300 dark:hover:bg-slate-600 transition-colors font-medium">
                                        ยกเลิก
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* EDIT PROFILE MODAL */}
                    {isEditProfileOpen && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
                            <div className="bg-white dark:bg-slate-800 rounded-2xl p-8 shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
                                <h2 className="text-2xl font-bold text-slate-900 dark:text-white mb-6">แก้ไขโปรไฟล์</h2>
                                <form onSubmit={handleSaveProfile} className="space-y-4">
                                    {/* Avatar Upload */}
                                    <div>
                                        <label className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">รูปโปรไฟล์</label>
                                        <div className="flex flex-col gap-4">
                                            {(profileAvatarPreview || profile.avatarUrl) && (
                                                <img src={profileAvatarPreview || profile.avatarUrl} alt="preview" className="w-32 h-32 rounded-lg object-cover" />
                                            )}
                                            <input 
                                                id="profileAvatarInput"
                                                type="file" 
                                                accept="image/*"
                                                onChange={handleProfileAvatarChange}
                                                className="px-4 py-2 border border-slate-200 dark:border-slate-700 rounded-lg dark:bg-slate-900 dark:text-white"
                                            />
                                        </div>
                                    </div>

                                    {/* Name */}
                                    <div>
                                        <label className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">ชื่อ</label>
                                        <input 
                                            type="text" 
                                            value={editProfileData.name}
                                            onChange={(e) => setEditProfileData({...editProfileData, name: e.target.value})}
                                            className="w-full px-4 py-3 rounded-lg border border-slate-200 dark:border-slate-700 dark:bg-slate-900 dark:text-white"
                                        />
                                    </div>

                                    {/* Subtitle */}
                                    <div>
                                        <label className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">ศิรษะข้อความ</label>
                                        <input 
                                            type="text" 
                                            value={editProfileData.subtitle}
                                            onChange={(e) => setEditProfileData({...editProfileData, subtitle: e.target.value})}
                                            className="w-full px-4 py-3 rounded-lg border border-slate-200 dark:border-slate-700 dark:bg-slate-900 dark:text-white"
                                        />
                                    </div>

                                    {/* Description */}
                                    <div>
                                        <label className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">คำอธิบาย</label>
                                        <textarea 
                                            value={editProfileData.description}
                                            onChange={(e) => setEditProfileData({...editProfileData, description: e.target.value})}
                                            rows="3"
                                            className="w-full px-4 py-3 rounded-lg border border-slate-200 dark:border-slate-700 dark:bg-slate-900 dark:text-white">
                                        </textarea>
                                    </div>

                                    {/* Tag */}
                                    <div>
                                        <label className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">ป้ายกำกับ</label>
                                        <input 
                                            type="text" 
                                            value={editProfileData.tag}
                                            onChange={(e) => setEditProfileData({...editProfileData, tag: e.target.value})}
                                            className="w-full px-4 py-3 rounded-lg border border-slate-200 dark:border-slate-700 dark:bg-slate-900 dark:text-white"
                                        />
                                    </div>

                                    <div className="flex gap-3 pt-4">
                                        <button type="submit" disabled={isUploadingProfile} className="flex-1 px-6 py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors font-medium disabled:opacity-50">
                                            {isUploadingProfile ? 'กำลังบันทึก...' : 'บันทึก'}
                                        </button>
                                        <button type="button" onClick={() => setIsEditProfileOpen(false)} className="flex-1 px-6 py-3 bg-slate-200 dark:bg-slate-700 text-slate-900 dark:text-white rounded-lg hover:bg-slate-300 dark:hover:bg-slate-600 transition-colors font-medium">
                                            ยกเลิก
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* CREATE FOLDER MODAL */}
                    {isFolderModalOpen && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
                            <div className="bg-white dark:bg-slate-800 rounded-2xl p-8 shadow-2xl max-w-md w-full">
                                <h2 className="text-2xl font-bold text-slate-900 dark:text-white mb-6">สร้างโฟลเดอร์ใหม่</h2>
                                <form onSubmit={handleCreateFolder} className="space-y-4">
                                    <input 
                                        type="text" 
                                        placeholder="ชื่อโฟลเดอร์"
                                        value={newFolderTitle}
                                        onChange={(e) => setNewFolderTitle(e.target.value)}
                                        className="w-full px-4 py-3 rounded-lg border border-slate-200 dark:border-slate-700 dark:bg-slate-900 dark:text-white"
                                    />
                                    <textarea 
                                        placeholder="คำอธิบาย"
                                        value={newFolderDesc}
                                        onChange={(e) => setNewFolderDesc(e.target.value)}
                                        rows="3"
                                        className="w-full px-4 py-3 rounded-lg border border-slate-200 dark:border-slate-700 dark:bg-slate-900 dark:text-white">
                                    </textarea>
                                    <label className="flex items-center gap-2 cursor-pointer">
                                        <input 
                                            type="checkbox" 
                                            checked={newFolderShowHome}
                                            onChange={(e) => setNewFolderShowHome(e.target.checked)}
                                            className="w-4 h-4"
                                        />
                                        <span className="text-slate-700 dark:text-slate-300">แสดงในหน้าแรก</span>
                                    </label>
                                    <div className="flex gap-3">
                                        <button type="submit" className="flex-1 px-6 py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors font-medium">
                                            สร้าง
                                        </button>
                                        <button type="button" onClick={() => setIsFolderModalOpen(false)} className="flex-1 px-6 py-3 bg-slate-200 dark:bg-slate-700 text-slate-900 dark:text-white rounded-lg hover:bg-slate-300 dark:hover:bg-slate-600 transition-colors font-medium">
                                            ยกเลิก
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* CERTIFICATE UPLOAD MODAL */}
                    {isCertUploadOpen && currentFolderForCert && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
                            <div className="bg-white dark:bg-slate-800 rounded-2xl p-8 shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
                                <h2 className="text-2xl font-bold text-slate-900 dark:text-white mb-6">อัปโหลดเกียรติบัตร - {currentFolderForCert.title}</h2>
                                <form onSubmit={handleAddCertificate} className="space-y-4">
                                    <input 
                                        type="text" 
                                        placeholder="ชื่อเกียรติบัตร"
                                        value={newCertTitle}
                                        onChange={(e) => setNewCertTitle(e.target.value)}
                                        className="w-full px-4 py-3 rounded-lg border border-slate-200 dark:border-slate-700 dark:bg-slate-900 dark:text-white"
                                    />
                                    
                                    {/* Image Upload */}
                                    <div>
                                        <label className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">อัปโหลดรูปภาพ</label>
                                        <input 
                                            id="certImageInput"
                                            type="file" 
                                            accept="image/*"
                                            onChange={handleCertImageChange}
                                            className="w-full px-4 py-2 border border-slate-200 dark:border-slate-700 rounded-lg dark:bg-slate-900 dark:text-white"
                                        />
                                        {certImagePreview && (
                                            <img src={certImagePreview} alt="preview" className="mt-4 max-h-60 rounded-lg object-contain mx-auto" />
                                        )}
                                    </div>

                                    {/* OR URL */}
                                    <div className="relative">
                                        <div className="absolute inset-0 flex items-center">
                                            <div className="w-full border-t border-slate-300 dark:border-slate-600"></div>
                                        </div>
                                        <div className="relative flex justify-center text-sm">
                                            <span className="px-2 bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-400">หรือ</span>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">ลิงก์รูปภาพ (URL)</label>
                                        <input 
                                            type="url" 
                                            placeholder="https://example.com/image.jpg"
                                            value={certImagePreview ? '' : newCertUrl}
                                            onChange={(e) => {
                                                setNewCertUrl(e.target.value);
                                                setCertImagePreview(null);
                                            }}
                                            className="w-full px-4 py-3 rounded-lg border border-slate-200 dark:border-slate-700 dark:bg-slate-900 dark:text-white"
                                        />
                                    </div>

                                    <div className="flex gap-3 pt-4">
                                        <button type="submit" disabled={isUploadingCert} className="flex-1 px-6 py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors font-medium disabled:opacity-50">
                                            {isUploadingCert ? 'กำลังอัปโหลด...' : 'อัปโหลด'}
                                        </button>
                                        <button type="button" onClick={() => {setIsCertUploadOpen(false); setCertImagePreview(null); setNewCertTitle(''); setNewCertUrl('');}} className="flex-1 px-6 py-3 bg-slate-200 dark:bg-slate-700 text-slate-900 dark:text-white rounded-lg hover:bg-slate-300 dark:hover:bg-slate-600 transition-colors font-medium">
                                            ยกเลิก
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* CERTIFICATE FOLDER DETAIL MODAL */}
                    {selectedCertFolder && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
                            <div className="bg-white dark:bg-slate-800 rounded-2xl p-8 shadow-2xl max-w-4xl w-full max-h-[90vh] overflow-y-auto">
                                <div className="flex justify-between items-start mb-6">
                                    <div>
                                        <h2 className="text-2xl font-bold text-slate-900 dark:text-white">{selectedCertFolder.title}</h2>
                                        <p className="text-slate-600 dark:text-slate-400 mt-2">{selectedCertFolder.description}</p>
                                    </div>
                                    <button onClick={() => setSelectedCertFolder(null)} className="text-slate-500 hover:text-slate-700 dark:hover:text-slate-300">
                                        <i className="fa-solid fa-times text-xl"></i>
                                    </button>
                                </div>

                                {isAdminLoggedIn && (
                                    <button 
                                        onClick={() => {
                                            setCurrentFolderForCert(selectedCertFolder);
                                            setIsCertUploadOpen(true);
                                        }}
                                        className="mb-6 px-6 py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors">
                                        <i className="fa-solid fa-plus mr-2"></i>เพิ่มเกียรติบัตร
                                    </button>
                                )}

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    {(selectedCertFolder.certificates || []).map(cert => (
                                        <div key={cert.id} className="bg-slate-100 dark:bg-slate-900 rounded-lg overflow-hidden">
                                            <img src={cert.url} alt={cert.title} className="w-full h-64 object-cover" />
                                            <div className="p-4">
                                                <h3 className="font-bold text-slate-900 dark:text-white mb-2">{cert.title}</h3>
                                                {isAdminLoggedIn && (
                                                    <button 
                                                        onClick={() => handleDeleteCert(selectedCertFolder.id, cert.id)}
                                                        className="px-3 py-1 text-sm bg-red-500/20 text-red-600 rounded hover:bg-red-500/30">
                                                        <i className="fa-solid fa-trash mr-2"></i>ลบ
                                                    </button>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
