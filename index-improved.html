        // 🚀 OPTIMIZED: Faster image compression with better settings
        function compressImage(file, maxDim = 1200, quality = 0.75) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        let { width, height } = img;
                        if (width > maxDim || height > maxDim) {
                            if (width > height) {
                                height = Math.round(height * (maxDim / width));
                                width = maxDim;
                            } else {
                                width = Math.round(width * (maxDim / height));
                                height = maxDim;
                            }
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        canvas.toBlob((blob) => {
                            if (blob) resolve({ blob, dataUrl: canvas.toDataURL('image/jpeg', quality) });
                            else reject(new Error('compress failed'));
                        }, 'image/jpeg', quality);
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

                                        )}

                                        <button type="submit" disabled={isUploadingCert || !certImageFile} className={btnPrimary + (isUploadingCert || !certImageFile ? ' opacity-50 cursor-not-allowed' : '')}>
                                            {isUploadingCert ? 'กำลังอัพโหลด...' : 'อัพโหลด'}
                                        </button>
                                        <button type="button" onClick={() => {
                                            setIsCertUploadOpen(false);
                                            setNewCertTitle('');
                                            setCertImagePreview(null);
                                            setCertImageFile(null);
                                        }} className="w-full px-4 py-2 border border-slate-200 dark:border-slate-600 rounded-lg">ยกเลิก</button>
                                    </form>
                                )}

                                {certFolders.length === 0 ? (
                                    <EmptyState icon="fa-award" text="ยังไม่มีเกียรติบัตร" />
                                ) : (
                                    <div className="space-y-4">
                                        {certFolders.map(f => (
                                            <div key={f.id} className={card + " p-4"}>
                                                <h3 className="font-bold mb-2">{f.title}</h3>
                                                <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                                                    {(f.certificates || []).map((cert, idx) => (
                                                        <div key={idx} className="rounded-lg overflow-hidden bg-slate-100 dark:bg-slate-700">
                                                            <img src={cert.imageUrl} alt={cert.title} className="w-full h-24 object-cover cursor-pointer hover:opacity-80 transition"
                                                                onClick={() => setLightbox({ certs: f.certificates, index: idx })} />
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* Events Tab - NEW */}
                        {activeTab === 'events' && (
                            <div className="animate-fade-in space-y-5">
                                <div className="flex items-center justify-between">
                                    <h1 className="text-2xl font-bold">บันทึกการเข้าร่วมกิจกรรม</h1>
                                </div>

                                {isAdminLoggedIn && (
                                    <form onSubmit={handleAddEvent} className={card + " p-4 space-y-3"}>
                                        <input value={newEventName} onChange={e => setNewEventName(e.target.value)}
                                            placeholder="ชื่อกิจกรรม" className={inputCls} />
                                        <input type="date" value={newEventDate} onChange={e => setNewEventDate(e.target.value)} className={inputCls} />
                                        <input value={newEventLocation} onChange={e => setNewEventLocation(e.target.value)}
                                            placeholder="สถานที่" className={inputCls} />
                                        <button type="submit" disabled={isAddingEvent} className={btnPrimary + (isAddingEvent ? ' opacity-50 cursor-not-allowed' : '')}>
                                            <i className="fa-solid fa-plus mr-1.5"></i>{isAddingEvent ? 'กำลังบันทึก...' : 'เพิ่มกิจกรรม'}
                                        </button>
                                    </form>
                                )}

                                {events.length === 0 ? (
                                    <EmptyState icon="fa-calendar" text="ยังไม่มีกิจกรรม" />
                                ) : (
                                    <div className="space-y-4">
                                        {events.map(event => (
                                            <div key={event.id} className={card + " p-4"}>
                                                <div className="flex items-start justify-between mb-3">
                                                    <div>
                                                        <h3 className="font-bold text-lg">{event.name}</h3>
                                                        <p className="text-sm text-slate-600 dark:text-slate-400">
                                                            <i className="fa-solid fa-calendar mr-1.5"></i>{event.date}
                                                            {event.location && <> <i className="fa-solid fa-location-dot mr-1.5"></i>{event.location}</>}
                                                        </p>
                                                    </div>
                                                    {isAdminLoggedIn && (
                                                        <button onClick={() => handleDeleteEvent(event.id)} className={btnDanger}>
                                                            <i className="fa-solid fa-trash"></i>
                                                        </button>
                                                    )}
                                                </div>

                                                <div className="border-t border-slate-200 dark:border-slate-700 pt-3">
                                                    <p className="text-xs font-medium text-slate-600 dark:text-slate-400 mb-2">เข้าร่วม ({(event.attendees || []).length} คน)</p>
                                                    <div className="space-y-2">
                                                        {['ธนัชชัย', 'เพื่อน 1', 'เพื่อน 2', 'เพื่อน 3'].map(name => (
                                                            <label key={name} className="flex items-center gap-2 cursor-pointer">
                                                                <input type="checkbox" checked={(event.attendees || []).includes(name)} onChange={() => handleMarkAttendance(event.id, name)} className="rounded" />
                                                                <span className="text-sm">{name}</span>
                                                            </label>
                                                        ))}
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* Announcements Tab */}
                        {activeTab === 'announcements' && (
                            <div className="animate-fade-in space-y-5">
                                <h1 className="text-2xl font-bold">ประกาศ &amp; ข่าวสาร</h1>
                                {announcements.length === 0 ? (
                                    <EmptyState icon="fa-bullhorn" text="ยังไม่มีประกาศ" />
                                ) : (
                                    <div className="space-y-3">
                                        {announcements.map(a => (
                                            <div key={a.id} className={card + " p-4"}>
                                                <p className="font-medium">{a.title}</p>
                                                {a.content && <p className="text-sm text-slate-600 dark:text-slate-400 mt-2">{a.content}</p>}
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* Videos Tab */}
                        {activeTab === 'videos' && (
                            <div className="animate-fade-in space-y-5">
                                <h1 className="text-2xl font-bold">คลิปวิดีโอ</h1>
                                {videos.length === 0 ? (
                                    <EmptyState icon="fa-video" text="ยังไม่มีวิดีโอ" />
                                ) : (
                                    <div className="grid sm:grid-cols-2 gap-4">
                                        {videos.map(v => (
                                            <div key={v.id} className={card + " overflow-hidden"}>
                                                <div className="aspect-video bg-black">
                                                    <iframe src={v.embedUrl} title={v.title} className="w-full h-full" allowFullScreen loading="lazy"></iframe>
                                                </div>
                                                <div className="p-3">
                                                    <p className="font-medium text-sm">{v.title}</p>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {/* Toast Notification */}
                    {toast && (
                        <div className={`fixed bottom-6 left-1/2 -translate-x-1/2 animate-toast px-4 py-3 rounded-lg text-white font-medium text-sm ${
                            toast.type === 'error' ? 'bg-red-500' : 'bg-green-500'
                        }`}>
                            {toast.message}
                        </div>
                    )}

                    {/* Lightbox */}
                    {lightbox && (
                        <div className="fixed inset-0 bg-black/90 z-40 flex items-center justify-center p-4" onClick={() => setLightbox(null)}>
                            <div className="relative max-w-3xl w-full" onClick={e => e.stopPropagation()}>
                                <img src={lightbox.certs[lightbox.index].imageUrl} alt="lightbox" className="w-full max-h-[80vh] object-contain" />
                                <button onClick={() => setLightbox(null)} className="absolute top-4 right-4 bg-black/50 hover:bg-black/70 text-white p-2 rounded-lg transition">
                                    <i className="fa-solid fa-xmark text-xl"></i>
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
